<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>GlobalSkill - Полный курс физики для ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;

            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
            color: var(--primary);
        }
        .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 10px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-success { background-color: var(--accent); }
        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-danger { background-color: var(--danger); }
        
        .section-block, .example-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.5;
        }
        .example-box {
            background: rgba(99, 102, 241, 0.08);
            border-left: 3px solid var(--primary);
        }
        h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: var(--primary);
            text-transform: uppercase;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .task-condition {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .feedback {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .feedback.error { background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .feedback.success { background-color: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: #6ee7b7; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .badge-easy { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-hard { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

</head>

        </div>

        </div>

            <div id="th-examples"></div>
        </div>

        <button class="btn btn-success" onclick="startTrainer('easy')">🟢 Легкий уровень (5 задач)</button>
        <button class="btn btn-warning" onclick="startTrainer('medium')">🟡 Средний уровень (5 задач)</button>

        <button class="btn btn-secondary" onclick="showScreen('screen-topics')" style="margin-top: 12px;">← К списку разделов</button>
    </div>

    <!-- Тренажер задач -->
    <div id="screen-trainer" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">

        </div>
        
        <div class="task-condition" id="tr-text"></div>
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить</button>
        </div>

        <button class="btn btn-secondary" onclick="openTopic(currentKey)">← Назад к теории</button>
    </div>
</div>

function showScreen(id) {
    document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function openTopic(key) {
    currentKey = key;
    const item = dataBase[key];
    document.getElementById('th-title').innerText = item.title;
    document.getElementById('th-formulas').innerHTML = item.formulas;
    document.getElementById('th-explanation').innerHTML = item.explanation;
    document.getElementById('th-examples').innerHTML = item.examples;
    showScreen('screen-theory');
}

let activeTasksList = [];

function startTrainer(level) {
    currentLevel = level;
    taskIndex = 0;
    activeTasksList = dataBase[currentKey].tasks[level];
    
    const badge = document.getElementById('tr-badge');
    if(level === 'easy') { badge.innerText = 'Легкий уровень'; badge.className = 'badge badge-easy'; }
    if(level === 'medium') { badge.innerText = 'Средний уровень'; badge.className = 'badge badge-medium'; }
    if(level === 'hard') { badge.innerText = 'Сложный уровень'; badge.className = 'badge badge-hard'; }
    
    showScreen('screen-trainer');
    loadTask();
}

function loadTask() {
    document.getElementById('feedback-container').innerHTML = '';
    document.getElementById('user-answer').value = '';
    document.getElementById('user-answer').style.display = 'block';
    document.querySelector('#answer-area .btn-success').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';

    document.getElementById('tr-counter').innerText = `Задача ${taskIndex + 1} из 5`;
    document.getElementById('tr-text').innerHTML = activeTasksList[taskIndex].text;
}

function checkAnswer() {
    const val = parseFloat(document.getElementById('user-answer').value);
    const correct = activeTasksList[taskIndex].ans;
    const fb = document.getElementById('feedback-container');

    if (isNaN(val)) {
        fb.innerHTML = `<div class="feedback error">Введите числовое значение!</div>`;
        return;
    }

    // Погрешность для сложных дробных ответов до 1% или абсолютная 0.05
    if (Math.abs(val - correct) <= Math.abs(correct * 0.02) + 0.05) {
        fb.innerHTML = `<div class="feedback success">🎉 Отлично! Ответ верный.</div>`;
    } else {
        fb.innerHTML = `<div class="feedback error">❌ Ошибка. Правильный ответ: <b>${correct}</b></div>`;
    }

    document.getElementById('user-answer').style.display = 'none';
    document.querySelector('#answer-area .btn-success').style.display = 'none';
    
    if (taskIndex < activeTasksList.length - 1) {
        document.getElementById('next-btn').style.display = 'block';
    } else {
        document.getElementById('next-btn').innerText = 'Завершить уровень 🎉';
        document.getElementById('next-btn').style.display = 'block';
    }
}

function nextTask() {
    taskIndex++;
    if (taskIndex < activeTasksList.length) {
        loadTask();
    } else {
        document.getElementById('next-btn').innerText = 'Следующая задача →';
        openTopic(currentKey);
    }
}

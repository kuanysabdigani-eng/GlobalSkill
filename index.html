<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            color: var(--primary);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .btn-success {
            background-color: var(--accent);
        }
        .section-block {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .section-block h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .example-box {
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--primary);
            padding: 14px;
            border-radius: 0 12px 12px 0;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .example-box h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: var(--accent);
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .task-condition {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .feedback {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .feedback.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .feedback.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: #6ee7b7;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GlobalSkill ⚡</h1>
        <div class="subtitle">Интерактивный тренажер для сотки на ЕНТ</div>
    </header>

    <!-- Главная страница -->
    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выбери предмет</h2>
        <button class="btn" onclick="showScreen('screen-physics-topics')">Физика</button>
        <button class="btn btn-secondary" onclick="alert('Математика появится в следующем обновлении!')">Математика</button>
    </div>

    <!-- Список разделов физики -->
    <div id="screen-physics-topics" class="card hidden">
        <h2 style="margin-top:0; font-size:18px;">Физика: Выбери раздел</h2>
        <button class="btn btn-secondary" onclick="openTopic('kinematics')">Кинематика</button>
        <button class="btn btn-secondary" onclick="openTopic('dynamics')">Динамика</button>
        <button class="btn btn-secondary" onclick="openTopic('conservation')">Законы сохранения</button>
        <button class="btn btn-secondary" onclick="openTopic('statics')">Статика</button>
        <button class="btn btn-secondary" onclick="openTopic('mkt')">МКТ и Термодинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('electrostatics')">Электростатика</button>
        <button class="btn btn-secondary" onclick="openTopic('electro')">Электродинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('magnetism')">Магнетизм и индукция</button>
        <button class="btn btn-secondary" onclick="openTopic('waves')">Колебания и волны</button>
        <button class="btn btn-secondary" onclick="openTopic('optics')">Оптика</button>
        <button class="btn btn-secondary" onclick="openTopic('quantum')">Квантовая и ядерная физика</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">← На главную</button>
    </div>

    <!-- Страница теория: Формулы -> Объяснение -> Примеры + Тренажер ДО -->
    <div id="screen-topic-view" class="card hidden">
        <h2 id="topic-title" style="margin-top:0; font-size:18px; margin-bottom: 16px;">Раздел</h2>
        
        <!-- Кнопка тренажера ДО теории -->
        <button class="btn btn-success" onclick="startTrainer()">⚡ Быстрый тренажер (ДО теории)</button>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">

        <!-- Блок 1: Формулы -->
        <div class="section-block">
            <h3>1. Основные формулы</h3>
            <div id="topic-formulas"></div>
        </div>

        <!-- Блок 2: Объяснение величин -->
        <div class="section-block">
            <h3>2. Объяснение величин</h3>
            <div id="topic-explanation"></div>
        </div>

        <!-- Блок 3: Разобранный пример -->
        <div class="example-box">
            <h3>3. Разбор примера</h3>
            <div id="topic-example"></div>
        </div>

        <!-- Кнопка тренажера ПОСЛЕ теории -->
        <button class="btn" onclick="startTrainer()">🚀 Запустить тренажер (ПОСЛЕ теории)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')">← К разделам физики</button>
    </div>

    <!-- Экран тренажера -->
    <div id="screen-trainer" class="card hidden">
        <h2 id="trainer-title" style="margin-top:0; font-size:18px;">Тренажер</h2>
        <div class="task-condition" id="task-text">Загрузка задачи...</div>
        
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить ответ</button>
        </div>

        <button class="btn btn-secondary" id="next-task-btn" onclick="generateTask()" style="display:none;">Следующая задача</button>
        <button class="btn btn-secondary" onclick="openTopic(currentTopic)">← Назад к теории</button>
    </div>
</div>

<script>
    let currentTopic = '';
    let correctAnswer = 0;

    const topicsData = {
        kinematics: {
            title: "Кинематика",
            formulas: "• S = v₀·t + (a·t²) / 2<br>• v = v₀ + a·t<br>• S = (v² - v₀²) / (2·а)",
            explanation: "• <b>S</b> — перемещение (путь), м<br>• <b>v₀</b> — начальная скорость, м/с<br>• <b>v</b> — конечная скорость, м/с<br>• <b>a</b> — ускорение, м/с²<br>• <b>t</b> — время, с",
            example: "Автомобиль едет с начальной скоростью <b>v₀ = 2 м/с</b>, ускорение <b>a = 3 м/с²</b>, время <b>t = 4 с</b>. Найдите перемещение <b>S</b>.<br><br><em>Решение:</em><br>S = 2·4 + (3·4²) / 2 = 8 + (3·16) / 2 = 8 + 24 = <b>32 м</b>."
        },
        dynamics: {
            title: "Динамика",
            formulas: "• F = m · a<br>• F_тр = μ · m · g<br>• F_упр = k · x",
            explanation: "• <b>F</b> — сила, Н<br>• <b>m</b> — масса тела, кг<br>• <b>a</b> — ускорение, м/с²<br>• <b>μ</b> — коэффициент трения (безразмерный)<br>• <b>g</b> — ускорение свободного падения (~10 м/с²)<br>• <b>k</b> — жесткость пружины, Н/м<br>• <b>x</b> — удлинение пружины, м",
            example: "Тело массой <b>m = 4 кг</b> движется под действием силы <b>F = 20 Н</b>. Найдите ускорение <b>a</b>.<br><br><em>Решение:</em><br>Из формулы F = m·a выражаем a: a = F / m = 20 / 4 = <b>5 м/с²</b>."
        },
        conservation: {
            title: "Законы сохранения",
            formulas: "• E_k = (m · v²) / 2<br>• E_p = m · g · h<br>• p = m · v",
            explanation: "• <b>E_k</b> — кинетическая энергия, Дж<br>• <b>E_p</b> — потенциальная энергия, Дж<br>• <b>p</b> — импульс тела, кг·м/с<br>• <b>m</b> — масса, кг<br>• <b>v</b> — скорость, м/с<br>• <b>h</b> — высота, м",
            example: "Найдите кинетическую энергию тела массой <b>m = 2 кг</b> при скорости <b>v = 6 м/с</b>.<br><br><em>Решение:</em><br>E_k = (2 · 6²) / 2 = (2 · 36) / 2 = <b>36 Дж</b>."
        },
        statics: {
            title: "Статика",
            formulas: "• M = F · d<br>• F_упр = k · x",
            explanation: "• <b>M</b> — момент силы, Н·м<br>• <b>F</b> — сила, Н<br>• <b>d</b> — плечо силы, м<br>• <b>k</b> — жесткость, Н/м<br>• <b>x</b> — деформация, м",
            example: "Пружина жесткостью <b>k = 200 Н/м</b> растянута на <b>x = 0.04 м</b>. Найдите силу упругости.<br><br><em>Решение:</em><br>F_упр = 200 · 0.04 = <b>8 Н</b>."
        },
        mkt: {
            title: "МКТ и Термодинамика",
            formulas: "• P · V = (m / M) · R · T<br>• Q = c · m · ΔT<br>• A = P · ΔV",
            explanation: "• <b>P</b> — давление, Па<br>• <b>V</b> — объем, м³<br>• <b>T</b> — температура, К<br>• <b>Q</b> — количество теплоты, Дж<br>• <b>c</b> — удельная теплоемкость, Дж/(кг·°C)<br>• <b>A</b> — работа газа, Дж",
            example: "Газ под давлением <b>P = 100 кПа</b> (100 000 Па) расширился на <b>ΔV = 0.02 м³</b>. Найдите работу газа.<br><br><em>Решение:</em><br>A = 100000 · 0.02 = <b>2000 Дж</b>."
        },
        electrostatics: {
            title: "Электростатика",
            formulas: "• F = (k · q₁ · q₂) / r²<br>• C = q / U",
            explanation: "• <b>F</b> — сила взаимодействия зарядов, Н<br>• <b>q₁, q₂</b> — электрические заряды, Кл<br>• <b>r</b> — расстояние между зарядами, м<br>• <b>C</b> — электроемкость, Ф<br>• <b>U</b> — напряжение, В",
            example: "Конденсатор с зарядом <b>q = 0.0002 Кл</b> находится под напряжением <b>U = 100 В</b>. Найдите емкость <b>C</b>.<br><br><em>Решение:</em><br>C = q / U = 0.0002 / 100 = <b>0.000002 Ф</b>."
        },
        electro: {
            title: "Электродинамика",
            formulas: "• I = U / R<br>• A = U · I · t",
            explanation: "• <b>I</b> — сила тока, А<br>• <b>U</b> — напряжение, В<br>• <b>R</b> — сопротивление, Ом<br>• <b>A</b> — работа тока, Дж<br>• <b>t</b> — время, с",
            example: "Напряжение в цепи <b>U = 220 В</b>, сопротивление резистора <b>R = 44 Ом</b>. Найдите силу тока <b>I</b>.<br><br><em>Решение:</em><br>I = U / R = 220 / 44 = <b>5 А</b>."
        },
        magnetism: {
            title: "Магнетизм и индукция",
            formulas: "• F_амп = I · B · l · sin(α)<br>• F_лор = q · v · B · sin(α)",
            explanation: "• <b>F_амп</b> — сила Ампера, Н<br><b>• F_лор</b> — сила Лоренца, Н<br>• <b>I</b> — сила тока, А<br>• <b>B</b> — индукция магнитного поля, Тл<br>• <b>l</b> — длина проводника, м",
            example: "Ток <b>I = 4 А</b> течет по проводнику длиной <b>l = 0.2 м</b> в поле с индукцией <b>B = 0.5 Тл</b> (угол 90°). Найдите силу Ампера.<br><br><em>Решение:</em><br>F = 4 · 0.5 · 0.2 · 1 = <b>0.4 Н</b>."
        },
        waves: {
            title: "Колебания и волны",
            formulas: "• T = 2π · √(m / k)<br>• v = λ · ν",
            explanation: "• <b>T</b> — период колебаний, с<br>• <b>ν (греч. ню)</b> — частота, Гц<br>• <b>λ (лямбда)</b> — длина волны, м<br>• <b>v</b> — скорость волны, м/с",
            example: "Длина волны равна <b>λ = 4 м</b>, а частота <b>ν = 5 Гц</b>. Найдите скорость волны <b>v</b>.<br><br><em>Решение:</em><br>v = λ · ν = 4 · 5 = <b>20 м/с</b>."
        },
        optics: {
            title: "Оптика",
            formulas: "• D = 1 / F<br>• 1 / F = 1 / d + 1 / f",
            explanation: "• <b>D</b> — оптическая сила линзы, дптр<br>• <b>F</b> — фокусное расстояние, м<br>• <b>d</b> — расстояние от предмета до линзы, м<br>• <b>f</b> — расстояние от изображения до линзы, м",
            example: "Фокусное расстояние линзы равно <b>F = 0.25 м</b>. Найдите ее оптическую силу <b>D</b>.<br><br><em>Решение:</em><br>D = 1 / 0.25 = <b>4 дптр</b>."
        },
        quantum: {
            title: "Квантовая и ядерная физика",
            formulas: "• E = h · ν<br>• h · ν = A_вых + E_кин",
            explanation: "• <b>E</b> — энергия фотона, Дж<br>• <b>h</b> — постоянная Планка<br>• <b>A_вых</b> — работа выхода электрона, Дж<br>• <b>E_кин</b> — кинетическая энергия фотоэлектрона, Дж",
            example: "Было <b>N₀ = 200</b> радиоактивных ядер. Сколько ядер останется спустя <b>n = 3</b> периода полураспада?<br><br><em>Решение:</em><br>N = N₀ / (2ⁿ) = 200 / (2³) = 200 / 8 = <b>25 ядер</b>."
        }
    };

    function showScreen(screenId) {
        document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function openTopic(topicKey) {
        currentTopic = topicKey;
        const data = topicsData[topicKey];
        document.getElementById('topic-title').innerText = data.title;
        document.getElementById('topic-formulas').innerHTML = data.formulas;
        document.getElementById('topic-explanation').innerHTML = data.explanation;
        document.getElementById('topic-example').innerHTML = data.example;
        showScreen('screen-topic-view');
    }

    function startTrainer() {
        document.getElementById('trainer-title').innerText = topicsData[currentTopic].title + " (Тренажер)";
        showScreen('screen-trainer');
        generateTask();
    }

    function generateTask() {
        document.getElementById('feedback-container').innerHTML = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').style.display = 'block';
        document.querySelector('#answer-area .btn-success').style.display = 'block';
        document.getElementById('next-task-btn').style.display = 'none';

        if (currentTopic === 'kinematics') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const v0 = Math.floor(Math.random() * 5), a = Math.floor(Math.random() * 3) + 1, t = Math.floor(Math.random() * 4) + 2;
                correctAnswer = v0 * t + (a * t * t) / 2;
                document.getElementById('task-text').innerHTML = `Тело движется с v₀ = <b>${v0} м/с</b> и ускорением a = <b>${a} м/с²</b> за t = <b>${t} с</b>. Найдите перемещение (в м).`;
            } else if (subType === 1) {
                const v0 = Math.floor(Math.random() * 5), a = Math.floor(Math.random() * 3) + 1, t = Math.floor(Math.random() * 4) + 2;
                correctAnswer = v0 + a * t;
                document.getElementById('task-text').innerHTML = `Тело разгоняется с v₀ = <b>${v0} м/с</b>, a = <b>${a} м/с²</b> за t = <b>${t} с</b>. Найдите конечную скорость (в м/с).`;
            } else {
                correctAnswer = 5;
                document.getElementById('task-text').innerHTML = `Тело движется равноускоренно с a = 2 м/с² и изменяет скорость с 2 м/с до 12 м/с. Найдите время движения (в с).`;
            }
        } 
        else if (currentTopic === 'dynamics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const m = Math.floor(Math.random() * 4) + 2, a = Math.floor(Math.random() * 5) + 1;
                correctAnswer = m * a;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> движется с ускорением <b>${a} м/с²</b>. Найдите силу (в Н).`;
            } else {
                const m = 5, mu = 0.2, g = 10;
                correctAnswer = mu * m * g;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> скользит по поверхности с коэффициентом трения μ = <b>${mu}</b> (g = 10 м/с²). Найдите силу трения (в Н).`;
            }
        }
        else if (currentTopic === 'conservation') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const m = 2, v = 6;
                correctAnswer = (m * v * v) / 2;
                document.getElementById('task-text').innerHTML = `Найдите кинетическую энергию (в Дж) тела массой <b>${m} кг</b> при скорости <b>${v} м/с</b>.`;
            } else if (subType === 1) {
                const m = 3, h = 4, g = 10;
                correctAnswer = m * g * h;
                document.getElementById('task-text').innerHTML = `Найдите потенциальную энергию (в Дж) тела массой <b>${m} кг</b> на высоте <b>${h} м</b> (g = 10).`;
            } else {
                const m = 4, v = 3;
                correctAnswer = m * v;
                document.getElementById('task-text').innerHTML = `Найдите импульс (в кг·м/с) тела массой <b>${m} кг</b>, движущегося со скоростью <b>${v} м/с</b>.`;
            }
        }
        else if (currentTopic === 'statics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const F = 10, d1 = 0.2, d2 = 0.4;
                correctAnswer = (F * d1) / d2;
                document.getElementById('task-text').innerHTML = `Сила <b>${F} Н</b> действует на плече <b>${d1} м</b>. Какая сила уравновесит ее на плече <b>${d2} м</b> (в Н)?`;
            } else {
                const k = 200, x = 0.04;
                correctAnswer = k * x;
                document.getElementById('task-text').innerHTML = `Пружина жесткостью <b>${k} Н/м</b> растянута на <b>${x} м</b>. Найдите силу упругости (в Н).`;
            }
        }
        else if (currentTopic === 'mkt') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const m = 2, c = 4200, dt = 10;
                correctAnswer = c * m * dt;
                document.getElementById('task-text').innerHTML = `Найдите количество теплоты (в Дж) для нагрева воды (c = 4200) массой <b>${m} кг</b> на <b>${dt} °C</b>.`;
            } else {
                const P = 100000, dV = 0.02;
                correctAnswer = P * dV;
                document.getElementById('task-text').innerHTML = `Газ при постоянном давлении <b>100 кПа</b> (100000 Па) расширился на <b>0.02 м³</b>. Найдите работу газа (в Дж).`;
            }
        }
        else if (currentTopic === 'electrostatics') {
            const q = 0.0002, U = 100;
            correctAnswer = Number((q / U).toFixed(6));
            document.getElementById('task-text').innerHTML = `Конденсатор с зарядом <b>0.0002 Кл</b> под напряжением <b>100 В</b>. Найдите электроемкость (в Ф).`;
        }
        else if (currentTopic === 'electro') {
            const U = 220, R = 44;
            correctAnswer = U / R;
            document.getElementById('task-text').innerHTML = `Напряжение <b>${U} В</b>, сопротивление <b>${R} Ом</b>. Найдите силу тока (в А).`;
        }
        else if (currentTopic === 'magnetism') {
            const I = 4, B = 0.5, l = 0.2;
            correctAnswer = I * B * l;
            document.getElementById('task-text').innerHTML = `Ток <b>${I} А</b> в проводнике длиной <b>${l} м</b> в поле с индукцией <b>${B} Тл</b>. Найдите силу Ампера (в Н).`;
        }
        else if (currentTopic === 'waves') {
            const lambda = 4, freq = 5;
            correctAnswer = lambda * freq;
            document.getElementById('task-text').innerHTML = `Длина волны <b>${lambda} м</b>, частота <b>${freq} Гц</b>. Найдите скорость волны (в м/с).`;
        }
        else if (currentTopic === 'optics') {
            const F = 0.25;
            correctAnswer = 1 / F;
            document.getElementById('task-text').innerHTML = `Фокусное расстояние линзы равно <b>0.25 м</b>. Найдите оптическую силу (в дптр).`;
        }
        else if (currentTopic === 'quantum') {
            const N0 = 200, n = 3;
            correctAnswer = N0 / Math.pow(2, n);
            document.getElementById('task-text').innerHTML = `Было <b>${N0}</b> ядер. Сколько ядер останется спустя <b>${n}</b> периода полураспада?`;
        }
    }

    function checkAnswer() {
        const userVal = parseFloat(document.getElementById('user-answer').value);
        const feedbackContainer = document.getElementById('feedback-container');

        if (isNaN(userVal)) {
            feedbackContainer.innerHTML = `<div class="feedback error">Введите числовой ответ!</div>`;
            return;
        }

        if (Math.abs(userVal - correctAnswer) < 0.05) {
            feedbackContainer.innerHTML = `<div class="feedback success">🎉 Верно! Отлично идешь к сотке.</div>`;
        } else {
            feedbackContainer.innerHTML = `<div class="feedback error">❌ Ошибка! Правильно: <b>${correctAnswer}</b>.</div>`;
        }

        document.getElementById('user-answer').style.display = 'none';
        document.querySelector('#answer-area .btn-success').style.display = 'none';
        document.getElementById('next-task-btn').style.display = 'block';
    }
</script>

</body>
</html>

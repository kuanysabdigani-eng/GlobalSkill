<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill — Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
        }
        h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 16px;
            color: #f1f5f9;
        }
        .menu-btn {
            background-color: #1e293b;
            color: var(--text);
            text-align: left;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            margin-top: 10px;
            font-weight: 500;
            border: 1px solid var(--border);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .menu-btn:hover {
            background-color: #273548;
            border-color: #475569;
        }
        .menu-btn::after {
            content: "›";
            font-size: 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GlobalSkill ⚡</h1>
        <p class="subtitle">Интерактивная платформа подготовки к ЕНТ</p>
    </div>

    <div class="card">
        <h3>Выбери предмет:</h3>
        <button class="menu-btn" onclick="alert('Физика в разработке')" style="border-left: 4px solid #6366f1;">Физика</button>
        <button class="menu-btn" onclick="alert('Математика в разработке')" style="border-left: 4px solid #38bdf8;">Математика</button>
        <button class="menu-btn" onclick="alert('История Казахстана в разработке')" style="border-left: 4px solid #f59e0b;">История Казахстана</button>
        <button class="menu-btn" onclick="alert('Математическая грамотность в разработке')" style="border-left: 4px solid #10b981;">Мат. грамотность</button>
        <button class="menu-btn" onclick="alert('Чтение в разработке')" style="border-left: 4px solid #ec4899;">Чтение</button>
    </div>
</div>

</body>
</html>

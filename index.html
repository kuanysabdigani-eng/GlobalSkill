<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            color: var(--primary);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .btn-success {
            background-color: var(--accent);
        }
        .formulas {
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .formulas strong {
            color: var(--text);
            display: block;
            margin-bottom: 4px;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .task-condition {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .feedback {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .feedback.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .feedback.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: #6ee7b7;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GlobalSkill ⚡</h1>
        <div class="subtitle">Интерактивный тренажер для сотки на ЕНТ</div>
    </header>

    <!-- Главная страница -->
    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выбери предмет</h2>
        <button class="btn" onclick="showScreen('screen-physics-topics')">Физика</button>
        <button class="btn btn-secondary" onclick="alert('Математика появится в следующем обновлении!')">Математика</button>
    </div>

    <!-- Список разделов физики -->
    <div id="screen-physics-topics" class="card hidden">
        <h2 style="margin-top:0; font-size:18px;">Физика: Выбери раздел</h2>
        <button class="btn btn-secondary" onclick="openTopic('kinematics')">Кинематика</button>
        <button class="btn btn-secondary" onclick="openTopic('dynamics')">Динамика</button>
        <button class="btn btn-secondary" onclick="openTopic('conservation')">Законы сохранения</button>
        <button class="btn btn-secondary" onclick="openTopic('statics')">Статика</button>
        <button class="btn btn-secondary" onclick="openTopic('mkt')">МКТ и Термодинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('electrostatics')">Электростатика</button>
        <button class="btn btn-secondary" onclick="openTopic('electro')">Электродинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('magnetism')">Магнетизм и индукция</button>
        <button class="btn btn-secondary" onclick="openTopic('waves')">Колебания и волны</button>
        <button class="btn btn-secondary" onclick="openTopic('optics')">Оптика</button>
        <button class="btn btn-secondary" onclick="openTopic('quantum')">Квантовая и ядерная физика</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">← На главную</button>
    </div>

    <!-- Страница теории и запуска тренажера -->
    <div id="screen-topic-view" class="card hidden">
        <h2 id="topic-title" style="margin-top:0; font-size:18px;">Раздел</h2>
        <div class="formulas" id="topic-formulas"></div>
        <button class="btn" onclick="startTrainer()">🚀 Запустить тренажер задач</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')">← К разделам физики</button>
    </div>

    <!-- Экран тренажера -->
    <div id="screen-trainer" class="card hidden">
        <h2 id="trainer-title" style="margin-top:0; font-size:18px;">Тренажер</h2>
        <div class="task-condition" id="task-text">Загрузка задачи...</div>
        
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить ответ</button>
        </div>

        <button class="btn btn-secondary" id="next-task-btn" onclick="generateTask()" style="display:none;">Следующая задача</button>
        <button class="btn btn-secondary" onclick="openTopic(currentTopic)">← Назад к формулам</button>
    </div>
</div>

<script>
    let currentTopic = '';
    let correctAnswer = 0;

    const topicsData = {
        kinematics: {
            title: "Кинематика",
            formulas: "<strong>Формулы:</strong><br>• S = v0*t + at^2/2<br>• v = v0 + at<br>• t = (v - v0)/a"
        },
        dynamics: {
            title: "Динамика",
            formulas: "<strong>Формулы:</strong><br>• F = m * a<br>• F_тр = mu * m * g<br>• a = (F2 - F1) / m"
        },
        conservation: {
            title: "Законы сохранения",
            formulas: "<strong>Формулы:</strong><br>• E_k = (m * v^2) / 2<br>• E_p = m * g * h<br>• p = m * v"
        },
        statics: {
            title: "Статика",
            formulas: "<strong>Формулы:</strong><br>• Момент силы: M = F * d<br>• Закон Гука: F = k * x"
        },
        mkt: {
            title: "МКТ и Термодинамика",
            formulas: "<strong>Формулы:</strong><br>• PV = (m/M)RT<br>• Q = c * m * ΔT<br>• Работа газа: A = P * ΔV"
        },
        electrostatics: {
            title: "Электростатика",
            formulas: "<strong>Формулы:</strong><br>• Закон Кулона: F = k * q1 * q2 / r^2<br>• C = q / U"
        },
        electro: {
            title: "Электродинамика",
            formulas: "<strong>Формулы:</strong><br>• Закон Ома: I = U / R<br>• Работа тока: A = U * I * t"
        },
        magnetism: {
            title: "Магнетизм и индукция",
            formulas: "<strong>Формулы:</strong><br>• Сила Ампера: F = I * B * l<br>• Сила Лоренца: F = q * v * B"
        },
        waves: {
            title: "Колебания и волны",
            formulas: "<strong>Формулы:</strong><br>• T = 2 * pi * sqrt(m / k)<br>• v = lambda * v_freq"
        },
        optics: {
            title: "Оптика",
            formulas: "<strong>Формулы:</strong><br>• Оптическая сила: D = 1 / F<br>• 1/F = 1/d + 1/f"
        },
        quantum: {
            title: "Квантовая и ядерная физика",
            formulas: "<strong>Формулы:</strong><br>• E = h * v<br>• h * v = A_вых + E_кин"
        }
    };

    function showScreen(screenId) {
        document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function openTopic(topicKey) {
        currentTopic = topicKey;
        const data = topicsData[topicKey];
        document.getElementById('topic-title').innerText = data.title;
        document.getElementById('topic-formulas').innerHTML = data.formulas;
        showScreen('screen-topic-view');
    }

    function startTrainer() {
        document.getElementById('trainer-title').innerText = topicsData[currentTopic].title + " (Тренажер)";
        showScreen('screen-trainer');
        generateTask();
    }

    function generateTask() {
        document.getElementById('feedback-container').innerHTML = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').style.display = 'block';
        document.querySelector('#answer-area .btn-success').style.display = 'block';
        document.getElementById('next-task-btn').style.display = 'none';

        if (currentTopic === 'kinematics') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const v0 = Math.floor(Math.random() * 5), a = Math.floor(Math.random() * 3) + 1, t = Math.floor(Math.random() * 4) + 2;
                correctAnswer = v0 * t + (a * t * t) / 2;
                document.getElementById('task-text').innerHTML = `Тело движется с v0 = <b>${v0} м/с</b> и ускорением a = <b>${a} м/с²</b> за t = <b>${t} с</b>. Найдите перемещение (в м).`;
            } else if (subType === 1) {
                const v0 = Math.floor(Math.random() * 5), a = Math.floor(Math.random() * 3) + 1, t = Math.floor(Math.random() * 4) + 2;
                correctAnswer = v0 + a * t;
                document.getElementById('task-text').innerHTML = `Тело разгоняется с v0 = <b>${v0} м/с</b>, a = <b>${a} м/с²</b> за t = <b>${t} с</b>. Найдите конечную скорость (в м/с).`;
            } else {
                correctAnswer = 5;
                document.getElementById('task-text').innerHTML = `Тело движется равноускорено с a = 2 м/с² и изменяет скорость с 2 м/с до 12 м/с. Найдите время движения (в с).`;
                correctAnswer = 5;
            }
        } 
        else if (currentTopic === 'dynamics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const m = Math.floor(Math.random() * 4) + 2, a = Math.floor(Math.random() * 5) + 1;
                correctAnswer = m * a;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> движется с ускорением <b>${a} м/с²</b>. Найдите силу (в Н).`;
            } else {
                const m = 5, mu = 0.2, g = 10;
                correctAnswer = mu * m * g;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> скользит по поверхности с коэффициентом трения μ = <b>${mu}</b> (g = 10 м/с²). Найдите силу трения (в Н).`;
            }
        }
        else if (currentTopic === 'conservation') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const m = 2, v = 6;
                correctAnswer = (m * v * v) / 2;
                document.getElementById('task-text').innerHTML = `Найдите кинетическую энергию (в Дж) тела массой <b>${m} кг</b> при скорости <b>${v} м/с</b>.`;
            } else if (subType === 1) {
                const m = 3, h = 4, g = 10;
                correctAnswer = m * g * h;
                document.getElementById('task-text').innerHTML = `Найдите потенциальную энергию (в Дж) тела массой <b>${m} кг</b> на высоте <b>${h} м</b> (g = 10).`;
            } else {
                const m = 4, v = 3;
                correctAnswer = m * v;
                document.getElementById('task-text').innerHTML = `Найдите импульс (в кг·м/с) тела массой <b>${m} кг</b>, движущегося со скоростью <b>${v} м/с</b>.`;
            }
        }
        else if (currentTopic === 'statics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const F = 10, d1 = 0.2, d2 = 0.4;
                correctAnswer = (F * d1) / d2;
                document.getElementById('task-text').innerHTML = `Сила <b>${F} Н</b> действует на плече <b>${d1} м</b>. Какая сила уравновесит ее на плече <b>${d2} м</b> (в Н)?`;
            } else {
                const k = 200, x = 0.04;
                correctAnswer = k * x;
                document.getElementById('task-text').innerHTML = `Пружина жесткостью <b>${k} Н/м</b> растянута на <b>${x} м</b>. Найдите силу упругости (в Н).`;
            }
        }
        else if (currentTopic === 'mkt') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const m = 2, c = 4200, dt = 10;
                correctAnswer = c * m * dt;
                document.getElementById('task-text').innerHTML = `Найдите количество теплоты (в Дж) для нагрева воды (c = 4200) массой <b>${m} кг</b> на <b>${dt} °C</b>.`;
            } else {
                const P = 100000, dV = 0.02;
                correctAnswer = P * dV;
                document.getElementById('task-text').innerHTML = `Газ при постоянном давлении <b>100 кПа</b> (100000 Па) расширился на <b>0.02 м³</b>. Найдите работу газа (в Дж).`;
            }
        }
        else if (currentTopic === 'electrostatics') {
            const q = 0.0002, U = 100;
            correctAnswer = Number((q / U).toFixed(6));
            document.getElementById('task-text').innerHTML = `Конденсатор с зарядом <b>0.0002 Кл</b> под напряжением <b>100 В</b>. Найдите электроемкость (в Ф).`;
        }
        else if (currentTopic === 'electro') {
            const U = 220, R = 44;
            correctAnswer = U / R;
            document.getElementById('task-text').innerHTML = `Напряжение <b>${U} В</b>, сопротивление <b>${R} Ом</b>. Найдите силу тока (в А).`;
        }
        else if (currentTopic === 'magnetism') {
            const I = 4, B = 0.5, l = 0.2;
            correctAnswer = I * B * l;
            document.getElementById('task-text').innerHTML = `Ток <b>${I} А</b> в проводнике длиной <b>${l} м</b> в поле с индукцией <b>${B} Тл</b>. Найдите силу Ампера (в Н).`;
        }
        else if (currentTopic === 'waves') {
            const lambda = 4, freq = 5;
            correctAnswer = lambda * freq;
            document.getElementById('task-text').innerHTML = `Длина волны <b>${lambda} м</b>, частота <b>${freq} Гц</b>. Найдите скорость волны (в м/с).`;
        }
        else if (currentTopic === 'optics') {
            const F = 0.25;
            correctAnswer = 1 / F;
            document.getElementById('task-text').innerHTML = `Фокусное расстояние линзы равно <b>0.25 м</b>. Найдите оптическую силу (в дптр).`;
        }
        else if (currentTopic === 'quantum') {
            const N0 = 200, n = 3;
            correctAnswer = N0 / Math.pow(2, n);
            document.getElementById('task-text').innerHTML = `Было <b>${N0}</b> ядер. Сколько ядер останется спустя <b>${n}</b> периода полураспада?`;
        }
    }

    function checkAnswer() {
        const userVal = parseFloat(document.getElementById('user-answer').value);
        const feedbackContainer = document.getElementById('feedback-container');

        if (isNaN(userVal)) {
            feedbackContainer.innerHTML = `<div class="feedback error">Введите числовой ответ!</div>`;
            return;
        }

        if (Math.abs(userVal - correctAnswer) < 0.05) {
            feedbackContainer.innerHTML = `<div class="feedback success">🎉 Верно! Отлично идешь к сотке.</div>`;
        } else {
            feedbackContainer.innerHTML = `<div class="feedback error">❌ Ошибка! Правильно: <b>${correctAnswer}</b>.</div>`;
        }

        document.getElementById('user-answer').style.display = 'none';
        document.querySelector('#answer-area .btn-success').style.display = 'none';
        document.getElementById('next-task-btn').style.display = 'block';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - ЕНТ Физика (Тренажер 45/45)</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --example-bg: #1e1b4b;
            --example-border: #4338ca;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.6;
        }
        .container { width: 100%; max-width: 720px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 26px; margin: 0 0 4px 0; color: var(--primary); }
        .subtitle { font-size: 14px; color: var(--text-secondary); }
        
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .btn {
            display: block; width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; text-align: center; margin-bottom: 10px;
            transition: all 0.2s; box-sizing: border-box;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); }
        .btn-warning { background-color: var(--warning); color: #000; font-weight: bold; }

        .option-btn {
            display: block; width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 15px;
            cursor: pointer; text-align: left; margin-bottom: 10px;
            transition: all 0.2s; box-sizing: border-box;
        }
        .option-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--accent); color: #6ee7b7; font-weight: bold; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

        /* Блок аналогичного примера */
        .example-box {
            background: var(--example-bg);
            border: 1px solid var(--example-border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .example-title {
            color: #a5b4fc;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .example-content {
            color: #e0e7ff;
            margin-bottom: 10px;
        }
        .example-sol {
            color: #93c5fd;
            font-size: 13.5px;
            border-top: 1px dashed var(--example-border);
            padding-top: 10px;
        }

        .task-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .solved-box {
            background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--warning);
            padding: 16px; border-radius: 0 12px 12px 0; font-size: 14px; margin-top: 16px;
        }

        .badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
        .badge-sim { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .hidden { display: none !important; }
        .math-sym { font-family: "Georgia", "Times New Roman", serif; font-style: italic; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GlobalSkill ⚡ ЕНТ Физика</h1>
        <div class="subtitle">Изучай пример-шаблон ➔ Решай задачу ниже ➔ Забирай 45/45</div>
    </header>

    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выбор режима прохождения</h2>
        <button class="btn btn-warning" onclick="startTest('all')">🔥 Марафон по всем темам (Все задачи)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-topics')">📚 Выбрать конкретный раздел</button>
    </div>

    <div id="screen-topics" class="card hidden">
        <h2 style="margin-top:0; font-size:18px;">Разделы физики ЕНТ</h2>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <button class="btn btn-secondary" onclick="startTest('kinematics')">1. Кинематика и Колебания</button>
            <button class="btn btn-secondary" onclick="startTest('dynamics')">2. Динамика, Законы сохранения и Энергия</button>
            <button class="btn btn-secondary" onclick="startTest('statics')">3. Статика и Гидростатика</button>
            <button class="btn btn-secondary" onclick="startTest('mkt')">4. МКТ, Газовые законы и Термодинамика</button>
            <button class="btn btn-secondary" onclick="startTest('electro')">5. Электростатика и Постоянный ток</button>
            <button class="btn btn-secondary" onclick="startTest('magnetism')">6. Магнетизм и Индукция</button>
            <button class="btn btn-secondary" onclick="startTest('optics')">7. Геометрическая и Волновая оптика</button>
            <button class="btn btn-secondary" onclick="startTest('quantum')">8. Квантовая и Ядерная физика</button>
        </div>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')" style="border-color: var(--primary); margin-top: 16px;">← Назад</button>
    </div>

    <div id="screen-test" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span class="badge badge-sim">🧠 Аналитический разбор-образец</span>
            <span id="test-counter" style="font-size: 13px; color: var(--text-secondary); font-weight: bold;"></span>
        </div>

        <!-- Похожий пример -->
        <div class="example-box">
            <div class="example-title">📘 Похожий пример (Смотри алгоритм решения):</div>
            <div id="example-problem" class="example-content"></div>
            <div id="example-solution" class="example-sol"></div>
        </div>

        <!-- Основная задача -->
        <div class="task-box">
            <div style="color: var(--accent); font-weight: bold; margin-bottom: 6px;">🎯 Твоя задача (примени алгоритм):</div>
            <div id="test-text" style="font-size: 15.5px;"></div>
        </div>

        <div id="options-container"></div>

        <div id="test-explanation-box" class="solved-box hidden">
            <h3 style="margin: 0 0 8px 0; color: var(--warning);">Полное решение твоей задачи:</h3>
            <div id="test-explanation-text"></div>
        </div>

        <button class="btn btn-warning hidden" id="test-next-btn" onclick="nextTestTask()" style="margin-top: 16px;">Следующая задача →</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')" style="margin-top: 10px;">← На главный экран</button>
    </div>
</div>

<script>
// РАСШИРЕННАЯ БАЗА МНОГОШАГОВЫХ СЛОЖНЫХ ЗАДАЧ ЕНТ
const hardcoreDB = [
    // ------------------- 1. КИНЕМАТИКА -------------------
    {
        topic: "kinematics",
        exText: "Из двух точек на высоте <span class='math-sym'>H</span> на расстоянии <span class='math-sym'>L = 200 м</span> одновременно бросают два тела: первое — вертикально вверх со скоростью <span class='math-sym'>v₁ = 30 м/с</span>, второе — под углом к горизонту навстречу первому со скоростью <span class='math-sym'>v₂ = 50 м/с</span>. Найти угол <span class='math-sym'>α</span> бросания второго тела, если они сталкиваются в воздухе.",
        exSol: "<b>Алгоритм решения:</b><br>1) Для столкновения их вертикальные координаты должны совпадать: <span class='math-sym'>v₁ · t - gt²/2 = v₂ · sin(α) · t - gt²/2</span>.<br>2) Сокращаем время: <span class='math-sym'>v₁ = v₂ · sin(α)</span> ➔ <span class='math-sym'>sin(α) = 30 / 50 = 0.6</span>.<br>3) Угол равен: <span class='math-sym'>α = 37°</span>.",
        text: "Снаряд вылетает из пушки со скоростью <span class='math-sym'>v₀ = 200 м/с</span> под углом <span class='math-sym'>60°</span> к горизонту. В высшей точке траектории снаряд разрывается на два одинаковых по массе осколка. Первый осколок сразу после взрыва падает вертикально вниз с нулевой начальной скоростью. На каком расстоянии (в км) от пушки упадет второй осколок? (<span class='math-sym'>g = 10 м/с²</span>)",
        ans: 5.2,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Горизонтальная скорость: <span class='math-sym'>v_0x = 200 · cos(60°) = 100 м/с</span>, вертикальная: <span class='math-sym'>v_0y = 200 · sin(60°) = 173.2 м/с</span>.<br>2) Время подъема до вершины: <span class='math-sym'>t = 173.2 / 10 = 17.32 с</span>.<br>3) Расстояние до точки взрыва: <span class='math-sym'>x₁ = 100 · 17.32 = 1732 м</span>.<br>4) Закон сохранения импульса при взрыве: <span class='math-sym'>m · v_0x = (m/2) · 0 + (m/2) · v₂</span> ➔ <span class='math-sym'>v₂ = 200 м/с</span>.<br>5) Дополнительный путь 2-го осколка: <span class='math-sym'>x₂ = 200 · 17.32 = 3464 м</span>.<br>6) Итоговое расстояние: <span class='math-sym'>X = 1732 + 3464 = 5196 м ≈ 5.2 км</span>."
    },
    {
        topic: "kinematics",
        exText: "Первую треть пути автомобиль двигался со скоростью <span class='math-sym'>10 м/с</span>, а оставшиеся 2/3 пути — со скоростью <span class='math-sym'>20 м/с</span> на первой половине оставшегося времени и <span class='math-sym'>30 м/с</span> на второй половине времени. Найти среднюю скорость.",
        exSol: "<b>Алгоритм решения:</b><br>1) Средняя скорость на второй части: <span class='math-sym'>v₂₃ = (20 + 30) / 2 = 25 м/с</span>.<br>2) Полное время: <span class='math-sym'>t = (S/3)/10 + (2S/3)/25 = 3S/50</span>.<br>3) Средняя скорость: <span class='math-sym'>v_ср = S / (3S/50) = 16.7 м/с</span>.",
        text: "Катер проходит расстояние между двумя пристанями по течению реки за время <span class='math-sym'>t₁ = 3 ч</span>, а против течения — за время <span class='math-sym'>t₂ = 6 ч</span>. За сколько часов преодолеет это же расстояние плот, плывущий со скоростью течения реки?",
        ans: 12,
        hint: "<b>Подробный шаг за шагом:</b><br>1) По течению: <span class='math-sym'>v_к + v_р = L / 3</span>.<br>2) Против течения: <span class='math-sym'>v_к - v_р = L / 6</span>.<br>3) Вычитаем уравнения: <span class='math-sym'>2v_р = L/3 - L/6 = L/6</span> ➔ <span class='math-sym'>v_р = L / 12</span>.<br>4) Время плота: <span class='math-sym'>t = L / v_р = 12 ч</span>."
    },
    {
        topic: "kinematics",
        exText: "Математический маятник длиной <span class='math-sym'>L = 1 м</span> совершает малые колебания. Найти его период <span class='math-sym'>T</span>, если <span class='math-sym'>g ≈ π²</span>.",
        exSol: "<b>Алгоритм решения:</b><br>Формула Гюйгенса: <span class='math-sym'>T = 2π √(L / g) = 2π √(1 / π²) = 2 с</span>.",
        text: "Пружинный маятник с массой груза <span class='math-sym'>m = 0.4 кг</span> и жесткостью пружины <span class='math-sym'>k = 40 Н/м</span> совершает свободные гармонические колебания с амплитудой <span class='math-sym'>A = 10 см</span>. Чему равна максимальная скорость груза <span class='math-sym'>v_max</span> (в м/с)?",
        ans: 1,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Циклическая частота: <span class='math-sym'>ω = √(k / m) = √(40 / 0.4) = √100 = 10 рад/с</span>.<br>2) Амплитуда в метрах: <span class='math-sym'>A = 0.1 м</span>.<br>3) Максимальная скорость: <span class='math-sym'>v_max = ω · A = 10 · 0.1 = 1 м/с</span>."
    },

    // ------------------- 2. ДИНАМИКА И ЭНЕРГИЯ -------------------
    {
        topic: "dynamics",
        exText: "Брусок массой <span class='math-sym'>m₁ = 2 кг</span> на наклонной плоскости (<span class='math-sym'>30°</span>) связан нитью с грузом <span class='math-sym'>m₂ = 3 кг</span>. <span class='math-sym'>μ = 0.2</span>. Найти ускорение.",
        exSol: "<b>Алгоритм решения:</b><br>1) Скатывающая сила: <span class='math-sym'>10 Н</span>. Трение: <span class='math-sym'>0.2 · 20 · 0.866 = 3.46 Н</span>.<br>2) Тянет груз <span class='math-sym'>F₂ = 30 Н</span>.<br>3) Ускорение: <span class='math-sym'>a = (30 - 10 - 3.46) / (2 + 3) = 3.31 м/с²</span>.",
        text: "Брусок массой <span class='math-sym'>m₁ = 2 кг</span> на наклонной плоскости с углом <span class='math-sym'>30°</span> соединен нитью через блок с грузом <span class='math-sym'>m₂ = 3 кг</span>. Коэффициент трения <span class='math-sym'>μ = 0.2</span>. Какой путь (в метрах) пройдет система за первые <span class='math-sym'>t = 2 с</span> движения из состояния покоя? (<span class='math-sym'>g = 10 м/с²</span>, <span class='math-sym'>cos 30° ≈ 0.866</span>)",
        ans: 6.6,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Силы: <span class='math-sym'>F_ск = 10 Н</span>, <span class='math-sym'>F_тр = 3.46 Н</span>, <span class='math-sym'>F₂ = 30 Н</span>.<br>2) Ускорение: <span class='math-sym'>a = (30 - 13.46) / 5 = 3.31 м/с²</span>.<br>3) Путь: <span class='math-sym'>S = a · t² / 2 = 3.31 · 4 / 2 = 6.62 м ≈ 6.6 м</span>."
    },
    {
        topic: "dynamics",
        exText: "Шайба соскальзывает с вершины сферы радиусом <span class='math-sym'>R = 1.2 м</span>. На какой высоте от центра она оторвется?",
        exSol: "<b>Алгоритм решения:</b><br>Условие отрыва со сферы: <span class='math-sym'>cos(θ) = 2/3</span>.<br>Высота от центра: <span class='math-sym'>h = R · (2/3) = 1.2 · (2/3) = 0.8 м</span>.",
        text: "Шайба соскальзывает без трения с вершины полусферы радиусом <span class='math-sym'>R = 90 см</span>. На каком расстоянии по вертикали от вершины сферы (в см) шайба оторвется от ее поверхности?",
        ans: 30,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Отрыв происходит при <span class='math-sym'>cos(θ) = 2/3</span>.<br>2) Высота от центра: <span class='math-sym'>h = 90 · (2/3) = 60 см</span>.<br>3) Расстояние по вертикали от самой вершины: <span class='math-sym'>y = R - h = 90 - 60 = 30 см</span>."
    },
    {
        topic: "dynamics",
        exText: "Подъемник поднимает груз 100 кг на высоту 20 м за 10 с. Потребляемая мощность 3 кВт. Найти КПД.",
        exSol: "<b>Алгоритм решения:</b><br>1) Полезная работа: <span class='math-sym'>A = mgh = 100 · 10 · 20 = 20 000 Дж</span>.<br>2) Затрачено энергии: <span class='math-sym'>A_затр = P · t = 3000 · 10 = 30 000 Дж</span>.<br>3) КПД: <span class='math-sym'>η = 20000 / 30000 = 66.7%</span>.",
        text: "Автомобиль массой <span class='math-sym'>m = 1500 кг</span> разгоняется с места до скорости <span class='math-sym'>v = 72 км/ч</span> (20 м/с) на горизонтальном участке пути длиной <span class='math-sym'>S = 200 м</span>. Коэффициент сопротивления движению <span class='math-sym'>μ = 0.05</span>. Найти среднюю полезную мощность двигателя (в кВт) за время разгона (<span class='math-sym'>g = 10 м/с²</span>).",
        ans: 22.5,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Ускорение: <span class='math-sym'>v² = 2aS ➔ 400 = 400a ➔ a = 1 м/с²</span>.<br>2) Время разгона: <span class='math-sym'>t = v / a = 20 с</span>.<br>3) Сила тяги: <span class='math-sym'>F = ma + μmg = 1500·1 + 0.05·1500·10 = 2250 Н</span>.<br>4) Полезная работа: <span class='math-sym'>A = F · S = 2250 · 200 = 450 000 Дж</span>.<br>5) Мощность: <span class='math-sym'>P = A / t = 450 000 / 20 = 22 500 Вт = 22.5 кВт</span>."
    },

    // ------------------- 3. СТАТИКА И ГИДРОСТАТИКА -------------------
    {
        topic: "statics",
        exText: "Деревянный брусок плавает на границе воды (1000 кг/м³) и масла (800 кг/м³), погружаясь в воду на 60% объема, а в масло на 40%. Найти плотность дерева.",
        exSol: "<b>Алгоритм решения:</b><br>Закон Архимеда: <span class='math-sym'>ρ_дер = 0.6 · 1000 + 0.4 · 800 = 600 + 320 = 920 кг/м³</span>.",
        text: "В U-образную трубку налита ртуть (<span class='math-sym'>ρ_рт = 13600 кг/м³</span>). В одно из колен наливают столб масла (<span class='math-sym'>ρ_мас = 800 кг/м³</span>) высотой <span class='math-sym'>h₁ = 34 см</span>. На сколько сантиметров поднимается уровень ртути во втором колене?",
        ans: 1,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Давление масла: <span class='math-sym'>P = ρ_мас · g · h₁</span>.<br>2) Оно уравновешивается разностью уровней ртути <span class='math-sym'>ΔH</span>: <span class='math-sym'>ρ_мас · h₁ = ρ_рт · ΔH ➔ ΔH = (800 · 34) / 13600 = 2 см</span>.<br>3) Уровень ртути во втором колене поднимается на половину разности: <span class='math-sym'>x = ΔH / 2 = 1 см</span>."
    },

    // ------------------- 4. МКТ И ТЕРМОДИНАМИКА -------------------
    {
        topic: "mkt",
        exText: "При нагревании идеального газа температура увеличилась в 1.5 раза, а давление выросло на 20%. Во сколько раз изменился объем?",
        exSol: "<b>Алгоритм решения:</b><br><span class='math-sym'>V₂ / V₁ = (P₁ / P₂) · (T₂ / T₁) = (1 / 1.2) · 1.5 = 1.25 раза</span>.",
        text: "В закрытом сосуде объемом <span class='math-sym'>V = 10 л</span> находится идеальный одноатомный газ под давлением <span class='math-sym'>P₁ = 100 кПа</span>. Газу передают количество теплоты <span class='math-sym'>Q = 3 кДж</span>. Каким станет итоговое давление газа в кПа?",
        ans: 300,
        hint: "<b>Подробный шаг за шагом:</b><br>1) Сосуд закрыт ➔ процесс изохорный (<span class='math-sym'>ΔV = 0</span>, работа <span class='math-sym'>A = 0</span>).<br>2) Первый закон термодинамики: <span class='math-sym'>Q = ΔU = (3/2) V · ΔP</span>.<br>3) <span class='math-sym'>3000 = 1.5 · 0.01 · ΔP ➔ ΔP = 200 000 Па = 200 кПа</span>.<br>4) Итоговое давление: <span class='math-sym'>P₂ = 100 + 200 = 300 кПа</span>."
    },
    {
        topic: "mkt",

let testList = [];
let testIndex = 0;
let answeredCurrent = false;

function startTest(topicKey) {
    if (topicKey === 'all') {
        testList = [...hardcoreDB];
        testList.sort(() => Math.random() - 0.5);
    } else {
        testList = hardcoreDB.filter(task => task.topic === topicKey);
        if (testList.length === 0) {
            alert("Раздел обновляется!");
            return;
        }
    }
    testIndex = 0;
    showScreen('screen-test');
    loadTestTask();
}

function loadTestTask() {
    answeredCurrent = false;
    const task = testList[testIndex];
    document.getElementById('test-counter').innerText = `Задача ${testIndex + 1} из ${testList.length}`;
    
    // Вывод аналогичного примера и условий
    document.getElementById('example-problem').innerHTML = task.exText;
    document.getElementById('example-solution').innerHTML = task.exSol;
    document.getElementById('test-text').innerHTML = task.text;

    document.getElementById('test-explanation-box').classList.add('hidden');
    document.getElementById('test-next-btn').classList.add('hidden');

    // Генерация 4 вариантов ответов
    const correct = task.ans;
    let options = [correct];

    while(options.length < 4) {
        let fake;
        let rand = Math.random();
        if (rand < 0.33) fake = Number((correct + Math.floor(Math.random() * 4) + 0.5).toFixed(2));
        else if (rand < 0.66) fake = Number((Math.abs(correct - Math.floor(Math.random() * 3) - 0.4)).toFixed(2));
        else fake = Number((correct * 1.5).toFixed(2));

        if(!options.includes(fake) && fake >= 0) {
            options.push(fake);
        }
    }
    options.sort(() => Math.random() - 0.5);

    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `Ответ: <b>${opt}</b>`;
        btn.onclick = () => selectOption(btn, opt, correct, task);
        optContainer.appendChild(btn);
    });
}

function selectOption(btn, chosen, correct, task) {
    if (answeredCurrent) return;
    answeredCurrent = true;

    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => {
        b.style.pointerEvents = 'none';
        if (b.innerText.includes(`Ответ: ${correct}`) || b.innerText.includes(`<b>${correct}</b>`)) {
            b.classList.add('correct');
        }
    });

    if (chosen !== correct) {
        btn.classList.add('wrong');
    }

    document.getElementById('test-explanation-text').innerHTML = task.hint;
    document.getElementById('test-explanation-box').classList.remove('hidden');
    document.getElementById('test-next-btn').classList.remove('hidden');
}

function nextTestTask() {
    testIndex++;
    if (testIndex < testList.length) {
        loadTestTask();
    } else {
        alert("Красава! Ты прошел весь выбранный блок задач!");
        showScreen('screen-home');
    }
}

function showScreen(id) {
    document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}
</script>

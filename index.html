<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            color: var(--primary);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .btn-success {
            background-color: var(--accent);
        }
        .section-block {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .section-block h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .example-box {
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--primary);
            padding: 14px;
            border-radius: 0 12px 12px 0;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .example-box h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: var(--accent);
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .task-condition {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .feedback {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .feedback.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .feedback.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: #6ee7b7;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GlobalSkill ⚡</h1>
        <div class="subtitle">Интерактивный тренажер для сотки на ЕНТ</div>
    </header>

    <!-- Главная страница -->
    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выбери предмет</h2>
        <button class="btn" onclick="showScreen('screen-physics-topics')">Физика</button>
        <button class="btn btn-secondary" onclick="alert('Математика появится в следующем обновлении!')">Математика</button>
    </div>

    <!-- Список разделов физики -->
    <div id="screen-physics-topics" class="card hidden">
        <h2 style="margin-top:0; font-size:18px;">Физика: Выбери раздел</h2>
        <button class="btn btn-secondary" onclick="openTopic('kinematics')">Кинематика</button>
        <button class="btn btn-secondary" onclick="openTopic('dynamics')">Динамика</button>
        <button class="btn btn-secondary" onclick="openTopic('conservation')">Законы сохранения</button>
        <button class="btn btn-secondary" onclick="openTopic('statics')">Статика</button>
        <button class="btn btn-secondary" onclick="openTopic('mkt')">МКТ и Термодинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('electrostatics')">Электростатика</button>
        <button class="btn btn-secondary" onclick="openTopic('electro')">Электродинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('magnetism')">Магнетизм и индукция</button>
        <button class="btn btn-secondary" onclick="openTopic('waves')">Колебания и волны</button>
        <button class="btn btn-secondary" onclick="openTopic('optics')">Оптика</button>
        <button class="btn btn-secondary" onclick="openTopic('quantum')">Квантовая и ядерная физика</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">← На главную</button>
    </div>

    <!-- Страница теория -->
    <div id="screen-topic-view" class="card hidden">
        <h2 id="topic-title" style="margin-top:0; font-size:18px; margin-bottom: 16px;">Раздел</h2>
        
        <button class="btn btn-success" onclick="startTrainer()">⚡ Быстрый тренажер (ДО теории)</button>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">

        <div class="section-block">
            <h3>1. Основные формулы</h3>
            <div id="topic-formulas"></div>
        </div>

        <div class="section-block">
            <h3>2. Объяснение величин</h3>
            <div id="topic-explanation"></div>
        </div>

        <div class="example-box">
            <h3>3. Разбор примера</h3>
            <div id="topic-example"></div>
        </div>

        <button class="btn" onclick="startTrainer()">🚀 Запустить тренажер (ПОСЛЕ теории)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')">← К разделам физики</button>
    </div>

    <!-- Экран тренажера -->
    <div id="screen-trainer" class="card hidden">
        <h2 id="trainer-title" style="margin-top:0; font-size:18px;">Тренажер</h2>
        <div class="task-condition" id="task-text">Загрузка задачи...</div>
        
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить ответ</button>
        </div>

        <button class="btn btn-secondary" id="next-task-btn" onclick="generateTask()" style="display:none;">Следующая задача</button>
        <button class="btn btn-secondary" onclick="openTopic(currentTopic)">← Назад к теории</button>
    </div>
</div>

<!-- Подключаем внешний файл со скриптами и данными -->
<script src="physics.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill — Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
        }
        h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 16px;
            color: #f1f5f9;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: #0b1120;
            color: white;
            font-size: 16px;
            margin-top: 12px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
        }
        .section-box {
            background: #1e293b;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .formula-list {
            color: #38bdf8;
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.6;
            font-family: monospace;
        }
        .menu-btn {
            background-color: #1e293b;
            color: var(--text);
            text-align: left;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            margin-top: 10px;
            font-weight: 500;
            border: 1px solid var(--border);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .menu-btn:hover {
            background-color: #273548;
            border-color: #475569;
        }
        .menu-btn::after {
            content: "›";
            font-size: 20px;
            color: var(--text-secondary);
        }
        .hidden { display: none; }
        .feedback {
            margin-top: 14px;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
        }
        .correct-text { background-color: rgba(16, 185, 129, 0.15); color: var(--accent); }
        .wrong-text { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .back-btn {
            background-color: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid var(--border);
            margin-top: 16px;
        }
        .back-btn:hover {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GlobalSkill ⚡</h1>
        <p class="subtitle">Интерактивный тренажер для сотки на ЕНТ</p>
    </div>

    <!-- Экран 1: Выбор предметов -->
    <div id="screen-home" class="card">
        <h3>Выбери предмет:</h3>
        <button class="menu-btn" onclick="openPhysicsMenu()" style="border-left: 4px solid #6366f1;">Физика</button>
        <button class="menu-btn" onclick="alert('Математика в разработке')" style="border-left: 4px solid #38bdf8;">Математика</button>
        <button class="menu-btn" onclick="alert('История Казахстана в разработке')" style="border-left: 4px solid #f59e0b;">История Казахстана</button>
        <button class="menu-btn" onclick="alert('Мат. грамотность в разработке')" style="border-left: 4px solid #10b981;">Мат. грамотность</button>
        <button class="menu-btn" onclick="alert('Чтение в разработке')" style="border-left: 4px solid #ec4899;">Чтение</button>
    </div>

    <!-- Экран 2: Меню разделов Физики -->
    <div id="screen-physics-menu" class="card hidden">
        <h3>Физика: Выбери раздел</h3>
        <button class="menu-btn" onclick="openSection('kinematics')">Кинематика</button>
        <button class="menu-btn" onclick="openSection('dynamics')">Динамика</button>
        <button class="menu-btn" onclick="openSection('thermo')">Термодинамика</button>
        <button class="back-btn" onclick="goHome()">← На главную</button>
    </div>

    <!-- Экран 3: Меню конкретного раздела -->
    <div id="screen-section" class="card hidden">
        <h3 id="section-title" style="color: #818cf8;">Раздел</h3>
        
        <div class="section-box">
            <div style="color: var(--text-secondary); font-size: 12px; text-transform: uppercase;">Основные формулы:</div>
            <div class="formula-list" id="section-formulas"></div>
        </div>

        <button onclick="startTrainer()" style="background-color: var(--accent); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">🚀 Запустить тренажер задач</button>
        <button class="back-btn" onclick="openPhysicsMenu()">← К разделам физики</button>
    </div>

    <!-- Экран 4: Тренажер задач -->
    <div id="screen-trainer" class="card hidden">
        <h3 id="trainer-title" style="color: #818cf8; font-size: 16px; margin-bottom: 10px;">Тренажер</h3>
        <p id="task-condition" style="font-size: 15px; line-height: 1.5; margin-bottom: 20px;"></p>
        <input type="number" id="user-answer" placeholder="Введи числовой ответ">
        <button onclick="checkAnswer()">Проверить ответ</button>
        <div id="feedback" class="feedback hidden"></div>
        <button class="back-btn" onclick="openSection(currentSectionKey)">← Назад к формулам</button>
    </div>
</div>

<script>
    const physicsSections = {
        kinematics: {
            title: "Кинематика",
            formulas: "• S = v0 * t + (a * t^2) / 2<br>• v = v0 + a * t<br>• S = v * t",
            generators: [
                () => {
                    let a = Math.floor(Math.random() * 4) + 2;
                    let t = Math.floor(Math.random() * 5) + 2;
                    let ans = (a * t * t) / 2;
                    return {
                        text: `Тело стартует из состояния покоя с ускорением <b>${a} м/с²</b>. Какой путь оно пройдет за <b>${t} с</b>?`,
                        ans: ans,
                        explanation: `S = (a * t^2) / 2 = (${a} * ${t}^2) / 2 = ${ans} м.`
                    };
                },
                () => {
                    let v = Math.floor(Math.random() * 10) + 5;
                    let t = Math.floor(Math.random() * 6) + 3;
                    let ans = v * t;
                    return {
                        text: `Автомобиль движется равномерно со скоростью <b>${v} м/с</b>. Какой путь он преодолеет за <b>${t} с</b>?`,
                        ans: ans,
                        explanation: `S = v * t = ${v} * ${t} = ${ans} м.`
                    };
                },
                () => {
                    let v0 = Math.floor(Math.random() * 5) + 2;
                    let a = 2;
                    let t = 4;
                    let ans = v0 + a * t;
                    return {
                        text: `Тело движется с начальной скоростью <b>${v0} м/с</b> и ускорением <b>${a} м/с²</b>. Найдите скорость через <b>${t} с</b>.`,
                        ans: ans,
                        explanation: `v = v0 + a * t = ${v0} + ${a} * ${t} = ${ans} м/с.`
                    };
                }
            ]
        },
        dynamics: {
            title: "Динамика",
            formulas: "• F = m * a<br>• F_тяж = m * g<br>• F_тр = mu * m * g",
            generators: [
                () => {
                    let m = Math.floor(Math.random() * 8) + 2;
                    let a = Math.floor(Math.random() * 5) + 2;
                    let ans = m * a;
                    return {
                        text: `Тело массой <b>${m} кг</b> движется с ускорением <b>${a} м/с²</b>. Найдите равнодействующую силу.`,
                        ans: ans,
                        explanation: `F = m * a = ${m} * ${a} = ${ans} Н.`
                    };
                },
                () => {
                    let m = Math.floor(Math.random() * 10) + 3;
                    let g = 10;
                    let ans = m * g;
                    return {
                        text: `Чему равна сила тяжести, действующая на тело массой <b>${m} кг</b>? (g = 10 м/с²)`,
                        ans: ans,
                        explanation: `F_тяж = m * g = ${m} * 10 = ${ans} Н.`
                    };
                },
                () => {
                    let mu = 0.2;
                    let m = 5;
                    let g = 10;
                    let ans = mu * m * g;
                    return {
                        text: `Брусок массой <b>${m} кг</b> скользит по полу. Коэффициент трения <b>${mu}</b>. Найдите силу трения. (g = 10 м/с²)`,
                        ans: ans,
                        explanation: `F_тр = mu * m * g = ${mu} * ${m} * 10 = ${ans} Н.`
                    };
                }
            ]
        },
        thermo: {
            title: "Термодинамика",
            formulas: "• A = P * dV<br>• Q = c * m * dT<br>• Q = lambda * m",
            generators: [
                () => {
                    let p = 100000;
                    let dv = Math.floor(Math.random() * 3) + 2;
                    let ans = p * dv;
                    return {
                        text: `Газ под постоянным давлением <b>100 000 Па</b> расширился на <b>${dv} м³</b>. Найдите работу газа.`,
                        ans: ans,
                        explanation: `A = P * dV = 100000 * ${dv} = ${ans} Дж.`
                    };
                },
                () => {
                    let m = 2;
                    let q = 330000;
                    let ans = q * m;
                    return {
                        text: `Сколько теплоты требуется для плавления <b>${m} кг</b> льда при температуре плавления? (уд. теплота плавления = 330 000 Дж/кг)`,
                        ans: ans,
                        explanation: `Q = lambda * m = 330000 * ${m} = ${ans} Дж.`
                    };
                }
            ]
        }
    };

    let currentSectionKey = null;
    let currentTask = null;

    function goHome() {
        document.getElementById('screen-physics-menu').classList.add('hidden');
        document.getElementById('screen-home').classList.remove('hidden');
    }

    function openPhysicsMenu() {
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-section').classList.add('hidden');
        document.getElementById('screen-physics-menu').classList.remove('hidden');
    }

    function openSection(key) {
        currentSectionKey = key;
        let sec = physicsSections[key];

        document.getElementById('screen-physics-menu').classList.add('hidden');
        document.getElementById('screen-trainer').classList.add('hidden');
        document.getElementById('screen-section').classList.remove('hidden');

        document.getElementById('section-title').innerText = sec.title;
        document.getElementById('section-formulas').innerHTML = sec.formulas;
    }

    function startTrainer() {
        let sec = physicsSections[currentSectionKey];
        document.getElementById('screen-section').classList.add('hidden');
        document.getElementById('screen-trainer').classList.remove('hidden');
        document.getElementById('trainer-title').innerText = sec.title + " (Тренажер)";
        generateNewTask();
    }

    function generateNewTask() {
        let sec = physicsSections[currentSectionKey];
        let randIndex = Math.floor(Math.random() * sec.generators.length);
        currentTask = sec.generators[randIndex]();

        document.getElementById('task-condition').innerHTML = currentTask.text;
        document.getElementById('user-answer').value = '';
        let fb = document.getElementById('feedback');
        fb.classList.add('hidden');
        fb.innerHTML = '';
    }

    function checkAnswer() {
        let userVal = parseFloat(document.getElementById('user-answer').value);
        let fb = document.getElementById('feedback');
        fb.classList.remove('hidden');

        if (isNaN(userVal)) {
            fb.innerHTML = "Введи числовой ответ!";
            fb.className = "feedback wrong-text";
            return;
        }

        if (Math.abs(userVal - currentTask.ans) < 0.1) {
            fb.innerHTML = "Красавчик! Ответ верный. Следующая...";
            fb.className = "feedback correct-text";
            setTimeout(generateNewTask, 1800);
        } else {
            fb.innerHTML = `Ошибка! Правильно: ${currentTask.ans}.<br><span style="font-weight:normal; font-size:13px;">Решение: ${currentTask.explanation}</span>`;
            fb.className = "feedback wrong-text";
        }
    }
</script>

</body>
</html>

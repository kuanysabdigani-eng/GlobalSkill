<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            color: var(--primary);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .btn-success {
            background-color: var(--accent);
        }
        .section-block {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .section-block h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .example-box {
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--primary);
            padding: 14px;
            border-radius: 0 12px 12px 0;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .example-box h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: var(--accent);
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .task-condition {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .feedback {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .feedback.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .feedback.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: #6ee7b7;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GlobalSkill ⚡</h1>
        <div class="subtitle">Интерактивный тренажер для сотки на ЕНТ</div>
    </header>

    <!-- Главная страница -->
    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выбери предмет</h2>
        <button class="btn" onclick="showScreen('screen-physics-topics')">Физика</button>
        <button class="btn btn-secondary" onclick="alert('Математика появится в следующем обновлении!')">Математика</button>
    </div>

    <!-- Список разделов физики -->
    <div id="screen-physics-topics" class="card hidden">
        <h2 style="margin-top:0; font-size:18px;">Физика: Выбери раздел</h2>
        <button class="btn btn-secondary" onclick="openTopic('kinematics')">Кинематика</button>
        <button class="btn btn-secondary" onclick="openTopic('dynamics')">Динамика</button>
        <button class="btn btn-secondary" onclick="openTopic('conservation')">Законы сохранения</button>
        <button class="btn btn-secondary" onclick="openTopic('statics')">Статика и гидростатика</button>
        <button class="btn btn-secondary" onclick="openTopic('mkt')">МКТ и Термодинамика</button>
        <button class="btn btn-secondary" onclick="openTopic('electrostatics')">Электростатика</button>
        <button class="btn btn-secondary" onclick="openTopic('electro')">Электродинамика (Постоянный ток)</button>
        <button class="btn btn-secondary" onclick="openTopic('magnetism')">Магнетизм и ЭМИ</button>
        <button class="btn btn-secondary" onclick="openTopic('waves')">Колебания и волны</button>
        <button class="btn btn-secondary" onclick="openTopic('optics')">Оптика (Волновая и геометрическая)</button>
        <button class="btn btn-secondary" onclick="openTopic('quantum')">Квантовая и ядерная физика</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">← На главную</button>
    </div>

    <!-- Страница теория -->
    <div id="screen-topic-view" class="card hidden">
        <h2 id="topic-title" style="margin-top:0; font-size:18px; margin-bottom: 16px;">Раздел</h2>
        
        <button class="btn btn-success" onclick="startTrainer()">⚡ Быстрый тренажер (ДО теории)</button>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">

        <div class="section-block">
            <h3>1. Полный набор формул</h3>
            <div id="topic-formulas"></div>
        </div>

        <div class="section-block">
            <h3>2. Обозначения и единицы СИ</h3>
            <div id="topic-explanation"></div>
        </div>

        <div class="example-box">
            <h3>3. Разбор типового примера ЕНТ</h3>
            <div id="topic-example"></div>
        </div>

        <button class="btn" onclick="startTrainer()">🚀 Запустить тренажер (ПОСЛЕ теории)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')">← К разделам физики</button>
    </div>

    <!-- Экран тренажера -->
    <div id="screen-trainer" class="card hidden">
        <h2 id="trainer-title" style="margin-top:0; font-size:18px;">Тренажер</h2>
        <div class="task-condition" id="task-text">Загрузка задачи...</div>
        
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить ответ</button>
        </div>

        <button class="btn btn-secondary" id="next-task-btn" onclick="generateTask()" style="display:none;">Следующая задача</button>
        <button class="btn btn-secondary" onclick="openTopic(currentTopic)">← Назад к теории</button>
    </div>
</div>

<script>
    let currentTopic = '';
    let correctAnswer = 0;

    const topicsData = {
        kinematics: {
            title: "Кинематика",
            formulas: "• S = v₀·t + (a·t²) / 2<br>• v = v₀ + a·t<br>• S = (v² - v₀²) / (2·a)<br>• S = ((v + v₀) / 2) · t<br>• x = x₀ + vₓ·t + (aₓ·t²) / 2<br>• v_ср = S_all / t_all<br>• v_ср = (2·v₁·v₂) / (v₁ + v₂)<br>• a = (v - v₀) / t<br>• H = (g·t²) / 2<br>• t_под = v₀ / g<br>• H_max = v₀² / (2·g)",
            explanation: "• <b>S</b> — путь/перемещение, м<br>• <b>v₀</b> — нач. скорость, м/с<br>• <b>v</b> — колич. скорость, м/с<br>• <b>a</b> — ускорение, м/с²<br>• <b>t</b> — время, с<br>• <b>x</b> — координата, м<br>• <b>H_max</b> — максимальная высота, м",
            example: "Тело брошено вертикально вверх с начальной скоростью <b>v₀ = 20 м/с</b>. Найдите время подъема до наивысшей точки (g = 10 м/с²).<br><br><em>Решение:</em><br>t_под = v₀ / g = 20 / 10 = <b>2 с</b>."
        },
        dynamics: {
            title: "Динамика",
            formulas: "• F = m · a<br>• F_тр = μ · N<br>• N = m·g (на горизонтальной плоскости)<br>• N = m·(g ± a_y) (в лифте)<br>• F_упр = k · |x|<br>• G = m · g<br>• F_тяж_з = G · (M·m) / R²<br>• a_центр = v² / R = ω² · R<br>• F_центр = (m · v²) / R",
            explanation: "• <b>F</b> — сила, Н<br>• <b>m</b> — масса, кг<br>• <b>a</b> — ускорение, м/с²<br>• <b>μ</b> — коэффициент трения<br>• <b>k</b> — жесткость, Н/м<br>• <b>R</b> — радиус круговой траектории, м",
            example: "Тело массой <b>m = 2 кг</b> движется по окружности радиусом <b>R = 1 м</b> со скоростью <b>v = 3 м/с</b>. Найдите центростремительную силу.<br><br><em>Решение:</em><br>F_центр = (m · v²) / R = (2 · 3²) / 1 = (2 · 9) / 1 = <b>18 Н</b>."
        },
        conservation: {
            title: "Законы сохранения",
            formulas: "• E_k = (m · v²) / 2<br>• E_p = m · g · h<br>• E_p_пруж = (k · x²) / 2<br>• E_full = E_k + E_p = const<br>• p = m · v<br>• Δp = F · t<br>• A = F · S · cos(α)<br>• A = -ΔE_p<br>• N = A / t = F · v",
            explanation: "• <b>E_k, E_p</b> — кинетическая и потенциальная энергии, Дж<br>• <b>p</b> — импульс, кг·м/с<br>• <b>A</b> — работа, Дж<br>• <b>N</b> — мощность, Вт",
            example: "Подъемник за время <b>t = 10 с</b> совершил работу <b>A = 5000 Дж</b>. Найдите полезную мощность крана.<br><br><em>Решение:</em><br>N = A / t = 5000 / 10 = <b>500 Вт</b>."
        },
        statics: {
            title: "Статика и гидростатика",
            formulas: "• M = F · d<br>• F₁ / F₂ = d₂ / d₁ (правило рычага)<br>• p = F / S<br>• p = p₀ + ρ · g · h<br>• F_A = ρ_ж · g · V_погруж<br>• F_упр = k · x<br>• S₁·v₁ = S₂·v₂ (уравнение неразрывности потока)",
            explanation: "• <b>M</b> — момент силы, Н·м<br>• <b>d</b> — плечо силы, м<br>• <b>p</b> — давление, Па<br>• <b>ρ</b> — плотность, кг/м³<br>• <b>F_A</b> — архимедова сила, Н",
            example: "На плечо рычага длиной <b>d₁ = 0.2 м</b> действует сила <b>F₁ = 15 Н</b>. Какая сила <b>F₂</b> уравновесит рычаг на плече <b>d₂ = 0.6 м</b>?<br><br><em>Решение:</em><br>F₁·d₁ = F₂·d₂ ⇒ F₂ = (15 · 0.2) / 0.6 = 3 / 0.6 = <b>5 Н</b>."
        },
        mkt: {
            title: "МКТ и Термодинамика",
            formulas: "• p = n·k·T = (1/3)·m₀·n·v²_кв<br>• pV = (m/M)RT = NkT<br>• E_kin = (3/2)kT<br>• v_кв = √(3RT / M) = √(3kT / m₀)<br>• Q = c·m·ΔT<br>• Q = λ·m (плавление)<br>• Q = L·m (парообразование)<br>• Q = q·m (сгорание топлива)<br>• ΔU = (3/2)·(m/M)·R·ΔT<br>• Q = ΔU + A<br>• A = p·ΔV (изобарный процесс)<br>• η = (Q_1 - Q_2) / Q_1 = (T_1 - T_2) / T_1",
            explanation: "• <b>R</b> = 8.31 Дж/(моль·К)<br>• <b>k</b> = 1.38·10⁻²³ Дж/К<br>• <b>N_A</b> = 6.02·10²³ моль⁻¹<br>• <b>η</b> — КПД тепловой машины",
            example: "Идеальная тепловая машина имеет температуру нагревателя <b>T₁ = 400 К</b> и холодильника <b>T₂ = 300 К</b>. Найдите КПД машины (в %).<br><br><em>Решение:</em><br>η = ((400 - 300) / 400) · 100% = (100 / 400) · 100% = <b>25 %</b>."
        },
        electrostatics: {
            title: "Электростатика",
            formulas: "• F = (k · |q₁·q₂|) / (ε·r²)<br>• E = F / q = (k·|q|) / (ε·r²)<br>• φ = W / q = (k·q) / r<br>• U = φ₁ - φ₂ = A / q<br>• C = q / U = (ε₀·ε·S) / d<br>• W_эл = (C·U²) / 2 = q² / (2C) = (q·U) / 2<br>• C_seq = (C₁·C₂) / (C₁ + C₂)<br>• C_par = C₁ + C₂",
            explanation: "• <b>q</b> — заряд, Кл<br>• <b>E</b> — напряженность, В/м<br>• <b>φ</b> — потенциал, В<br>• <b>C</b> — электроемкость, Ф",
            example: "Два конденсатора емкостью <b>C₁ = 2 мкФ</b> и <b>C₂ = 3 мкФ</b> соединены параллельно. Найдите общую емкость батареи (в мкФ).<br><br><em>Решение:</em><br>C_par = C₁ + C₂ = 2 + 3 = <b>5 мкФ</b>."
        },
        electro: {
            title: "Электродинамика",
            formulas: "• I = q / t = U / R<br>• R = (ρ · l) / S<br>• R_seq = R₁ + R₂<br>• 1 / R_par = 1/R₁ + 1/R₂<br>• A = U·I·t = I²·Rt = (U²/R)·t<br>• P = U·I = I²·R = U²/R<br>• I = E / (R + r) (закон Ома для полной цепи)<br>• I_max = E / r (ток короткого замыкания)",
            explanation: "• <b>I</b> — сила тока, А<br>• <b>R</b> — сопротивление, Ом<br>• <b>E</b> — ЭДС, В<br>• <b>r</b> — внутреннее сопротивление, Ом",
            example: "Резистор сопротивлением <b>R = 10 Ом</b> подключен к источнику с током <b>I = 2 А</b>. Найдите мощность выделяющегося тепла (в Вт).<br><br><em>Решение:</em><br>P = I² · R = 2² · 10 = 4 · 10 = <b>40 Вт</b>."
        },
        magnetism: {
            title: "Магнетизм и ЭМИ",
            formulas: "• F_амп = I·B·l·sin(α)<br>• F_лор = q·v·B·sin(α)<br>• R_траектории = (m·v) / (|q|·B)<br>• Ф = B·S·cos(α)<br>• E_i = - (ΔΦ / Δt)<br>• E_i_ind = B·l·v·sin(α)<br>• W_магнит = (L·I²) / 2",
            explanation: "• <b>B</b> — индукция магнитного поля, Тл<br>• <b>Ф</b> — магнитный поток, Вб<br>• <b>L</b> — индуктивность, Гн<br>• <b>E_i</b> — ЭДС индукции, В",
            example: "Магнитный поток, пронизывающий контур, изменился за <b>Δt = 0.2 с</b> от <b>0.5 Вб</b> до <b>0.1 Вб</b>. Найдите модуль ЭДС индукции (в В).<br><br><em>Решение:</em><br>E_i = |ΔΦ / Δt| = (0.5 - 0.1) / 0.2 = 0.4 / 0.2 = <b>2 В</b>."
        },
        waves: {
            title: "Колебания и волны",
            formulas: "• T = 1 / ν = t / N<br>• ω = 2π / T = 2πν<br>• T_пружин = 2π·√(m / k)<br>• T_мат = 2π·√(l / g)<br>• x(t) = x_max·cos(ωt + φ₀)<br>• v_волны = λ · ν = λ / T<br>• n_синус = sin(α) / sin(β)",
            explanation: "• <b>T</b> — период, с<br>• <b>ν</b> — частота, Гц<br>• <b>ω</b> — циклическая частота, рад/с<br>• <b>λ</b> — длина волны, м",
            example: "Маятник совершает <b>N = 50 колебаний за t = 10 секунд</b>. Найдите период колебаний (в с).<br><br><em>Решение:</em><br>T = t / N = 10 / 50 = <b>0.2 с</b>."
        },
        optics: {
            title: "Оптика",
            formulas: "• n₂₁ = n₂ / n₁ = v₁ / v₂ = λ₁ / λ₂<br>• sin(α) / sin(β) = n₂₁<br>• D = 1 / F<br>• 1 / F = 1/d + 1/f<br>• Г = f / d = H / h<br>• d·sin(α) = k·λ (дифракционная решетка)<br>• 2d·sin(α) = k·λ (Брэгг-Вульф)",
            explanation: "• <b>n</b> — показатель преломления<br>• <b>D</b> — оптическая сила, дптр<br>• <b>F</b> — фокусное расстояние, м<br>• <b>d, f</b> — расстояния от линзы до предмета и изображения",
            example: "Расстояние от предмета до собирающей линзы <b>d = 0.3 м</b>, а до изображения <b>f = 0.6 м</b>. Найдите линейное увеличение линзы.<br><br><em>Решение:</em><br>Г = f / d = 0.6 / 0.3 = <b>2</b>."
        },
        quantum: {
            title: "Квантовая и ядерная физика",
            formulas: "• E = h·ν = (c / λ)·h<br>• h·ν = A_вых + E_k_max<br>• p_фотона = E / c = h / λ<br>• N = N₀ · 2^(-t / T_half)<br>• m = m₀ · 2^(-t / T_half)<br>• E_binding = Δm · c²<br>• Δm = Z·m_p + (A - Z)·m_n - m_ядра",
            explanation: "• <b>h</b> = 6.63·10⁻³⁴ Дж·с<br>• <b>A_вых</b> — работа выхода электрона, Дж/эВ<br>• <b>T_half</b> — период полураспада, с<br>• <b>Δm</b> — дефект масс, кг",
            example: "Период полураспада радиоактивного изотопа равен <b>T_half = 2 суткам</b>. Сколько ядер останется из <b>80 млн</b> через <b>4 суток</b>?<br><br><em>Решение:</em><br>t / T_half = 4 / 2 = 2 периода.<br>N = 80 · (1/2)² = 80 / 4 = <b>20 млн</b>."
        }
    };

    function showScreen(screenId) {
        document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function openTopic(topicKey) {
        currentTopic = topicKey;
        const data = topicsData[topicKey];
        document.getElementById('topic-title').innerText = data.title;
        document.getElementById('topic-formulas').innerHTML = data.formulas;
        document.getElementById('topic-explanation').innerHTML = data.explanation;
        document.getElementById('topic-example').innerHTML = data.example;
        showScreen('screen-topic-view');
    }

    function startTrainer() {
        document.getElementById('trainer-title').innerText = topicsData[currentTopic].title + " (Тренажер)";
        showScreen('screen-trainer');
        generateTask();
    }

    function generateTask() {
        document.getElementById('feedback-container').innerHTML = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').style.display = 'block';
        document.querySelector('#answer-area .btn-success').style.display = 'block';
        document.getElementById('next-task-btn').style.display = 'none';

        if (currentTopic === 'kinematics') {
            const subType = Math.floor(Math.random() * 4);
            if (subType === 0) {
                const v0 = Math.floor(Math.random() * 4), a = Math.floor(Math.random() * 3) + 2, t = Math.floor(Math.random() * 4) + 2;
                correctAnswer = v0 * t + (a * t * t) / 2;
                document.getElementById('task-text').innerHTML = `Автомобиль стартует с v₀ = <b>${v0} м/с</b>, ускоряясь с a = <b>${a} м/с²</b> за t = <b>${t} с</b>. Найдите путь (в м).`;
            } else if (subType === 1) {
                const v = Math.floor(Math.random() * 10) + 15, v0 = 5, a = 2;
                correctAnswer = (v*v - v0*v0) / (2 * a);
                document.getElementById('task-text').innerHTML = `Скорость тела выросла с ${v0} до ${v} м/с при ускорении a = ${a} м/с². Найдите перемещение (в м).`;
            } else if (subType === 2) {
                const h = Math.floor(Math.random() * 3) + 2;
                correctAnswer = Number(Math.sqrt(2 * h * 10).toFixed(1));
                document.getElementById('task-text').innerHTML = `Тело свободно падает с высоты h = <b>${h} м</b> без начальной скорости (g=10). Найдите конечную скорость (в м/с).`;
            } else {
                const v0 = 20;
                correctAnswer = v0 / 10;
                document.getElementById('task-text').innerHTML = `Тело брошено вверх с v₀ = <b>${v0} м/с</b> (g=10). Найдите время подъема (в с).`;
            }
        } 
        else if (currentTopic === 'dynamics') {
            const subType = Math.floor(Math.random() * 4);
            if (subType === 0) {
                const m = Math.floor(Math.random() * 5) + 2, a = Math.floor(Math.random() * 4) + 2;
                correctAnswer = m * a;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> движется с ускорением <b>${a} м/с²</b>. Найдите силу (в Н).`;
            } else if (subType === 1) {
                const k = Math.floor(Math.random() * 100) + 100, x = 0.05;
                correctAnswer = k * x;
                document.getElementById('task-text').innerHTML = `Пружина жесткостью <b>${k} Н/м</b> деформирована на <b>0.05 м</b>. Найдите силу упругости (в Н).`;
            } else if (subType === 2) {
                const m = 4, mu = 0.2;
                correctAnswer = mu * m * 10;
                document.getElementById('task-text').innerHTML = `Брусок массой <b>${m} кг</b> скользит по полу с μ = <b>${mu}</b> (g=10). Найдите силу трения (в Н).`;
            } else {
                const m = 2, v = 6, R = 2;
                correctAnswer = (m * v * v) / R;
                document.getElementById('task-text').innerHTML = `Тело массой <b>${m} кг</b> движется по окружности радиусом <b>${R} м</b> со скоростью <b>${v} м/с</b>. Найдите центростремительную силу (в Н).`;
            }
        }
        else if (currentTopic === 'conservation') {
            const subType = Math.floor(Math.random() * 4);
            if (subType === 0) {
                const m = Math.floor(Math.random() * 3) + 2, v = Math.floor(Math.random() * 4) + 4;
                correctAnswer = (m * v * v) / 2;
                document.getElementById('task-text').innerHTML = `Найдите кинетическую энергию (в Дж) тела массой <b>${m} кг</b> при скорости <b>${v} м/с</b>.`;
            } else if (subType === 1) {
                const m = 3, h = 5;
                correctAnswer = m * 10 * h;
                document.getElementById('task-text').innerHTML = `Найдите потенциальную энергию (в Дж) груза массой <b>${m} кг</b> на высоте <b>${h} м</b> (g=10).`;
            } else if (subType === 2) {
                const m = 2, v = 5;
                correctAnswer = m * v;
                document.getElementById('task-text').innerHTML = `Найдите модуль импульса (в кг·м/с) тела массой <b>${m} кг</b> со скоростью <b>${v} м/с</b>.`;
            } else {
                const A = 400, t = 8;
                correctAnswer = A / t;
                document.getElementById('task-text').innerHTML = `Какая мощность (в Вт) развивается при совершении работы <b>${A} Дж</b> за <b>${t} с</b>?`;
            }
        }
        else if (currentTopic === 'statics') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const rho = 1000, h = 0.4;
                correctAnswer = rho * 10 * h;
                document.getElementById('task-text').innerHTML = `Найдите гидростатическое давление (в Па) столба воды высотой <b>${h} м</b> (ρ=1000, g=10).`;
            } else if (subType === 1) {
                const V = 0.02;
                correctAnswer = 1000 * 10 * V;
                document.getElementById('task-text').innerHTML = `Тело полностью погружено в воду, его объем <b>${V} м³</b> (ρ=1000, g=10). Найдите архимедову силу (в Н).`;
            } else {
                const F1 = 20, d1 = 0.3, d2 = 0.6;
                correctAnswer = (F1 * d1) / d2;
                document.getElementById('task-text').innerHTML = `Сила <b>${F1} Н</b> на плече <b>${d1} м</b> уравновешена на плече <b>${d2} м</b>. Найдите вторую силу (в Н).`;
            }
        }
        else if (currentTopic === 'mkt') {
            const subType = Math.floor(Math.random() * 3);
            if (subType === 0) {
                const nu = 2, T = 400;
                correctAnswer = 1.5 * nu * 8.31 * T;
                document.getElementById('task-text').innerHTML = `Найдите внутреннюю энергию (в Дж) <b>${nu} моль</b> одноатомного газа при <b>${T} К</b> (R=8.31).`;
            } else if (subType === 1) {
                const m = 0.5, c = 4200, dt = 20;
                correctAnswer = c * m * dt;
                document.getElementById('task-text').innerHTML = `Сколько теплоты (в Дж) нужно для нагрева воды (c=4200) массой <b>${m} кг</b> на <b>${dt} °C</b>?`;
            } else {
                const T1 = 500, T2 = 400;
                correctAnswer = ((T1 - T2) / T1) * 100;
                document.getElementById('task-text').innerHTML = `Нагреватель имеет <b>${T1} К</b>, холодильник <b>${T2} К</b>. Найдите КПД идеальной машины (в %).`;
            }
        }
        else if (currentTopic === 'electrostatics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const C = 10e-6, U = 200;
                correctAnswer = (C * U * U) / 2;
                document.getElementById('task-text').innerHTML = `Конденсатор емкостью <b>10 мкФ</b> (10⁻⁶ Ф) заряжен до <b>200 В</b>. Найдите энергию поля (в Дж).`;
            } else {
                const C1 = 4, C2 = 4;
                correctAnswer = (C1 * C2) / (C1 + C2);
                document.getElementById('task-text').innerHTML = `Два конденсатора <b>4 мкФ</b> и <b>4 мкФ</b> соединены последовательно. Найдите общую емкость (в мкФ).`;
            }
        }
        else if (currentTopic === 'electro') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const U = 110, R = 22;
                correctAnswer = U / R;
                document.getElementById('task-text').innerHTML = `Напряжение на резисторе <b>${U} В</b>, сопротивление <b>${R} Ом</b>. Найдите силу тока (в А).`;
            } else {
                const I = 3, R = 5;
                correctAnswer = I * I * R;
                document.getElementById('task-text').innerHTML = `Ток <b>${I} А</b> течет через резистор <b>${R} Ом</b>. Найдите мощность (в Вт).`;
            }
        }
        else if (currentTopic === 'magnetism') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const B = 0.4, l = 0.5, I = 5;
                correctAnswer = B * l * I;
                document.getElementById('task-text').innerHTML = `Ток <b>${I} А</b> в проводнике длиной <b>${l} м</b> в поле с индукцией <b>${B} Тл</b> (угол 90°). Найдите силу Ампера (в Н).`;
            } else {
                const dPhi = 0.6, dt = 0.3;
                correctAnswer = dPhi / dt;
                document.getElementById('task-text').innerHTML = `Магнитный поток изменился на <b>${dPhi} Вб</b> за <b>${dt} с</b>. Найдите ЭДС индукции (в В).`;
            }
        }
        else if (currentTopic === 'waves') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const lambda = 2.5, nu = 4;
                correctAnswer = lambda * nu;
                document.getElementById('task-text').innerHTML = `Длина волны <b>${lambda} м</b>, частота колебаний <b>${nu} Гц</b>. Найдите скорость волны (в м/с).`;
            } else {
                const N = 40, t = 10;
                correctAnswer = t / N;
                document.getElementById('task-text').innerHTML = `Маятник делает <b>${N} колебаний за ${t} с</b>. Найдите период (в с).`;
            }
        }
        else if (currentTopic === 'optics') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const F = 0.2;
                correctAnswer = 1 / F;
                document.getElementById('task-text').innerHTML = `Фокусное расстояние тонкой линзы равно <b>${F} м</b>. Найдите ее оптическую силу (в дптр).`;
            } else {
                const f = 0.8, d = 0.4;
                correctAnswer = f / d;
                document.getElementById('task-text').innerHTML = `Расстояние до изображения <b>${f} м</b>, до предмета <b>${d} м</b>. Найдите увеличение линзы.`;
            }
        }
        else if (currentTopic === 'quantum') {
            const subType = Math.floor(Math.random() * 2);
            if (subType === 0) {
                const E_ph = 5, A_out = 2;
                correctAnswer = E_ph - A_out;
                document.getElementById('task-text').innerHTML = `Энергия фотона <b>${E_ph} эВ</b>, работа выхода <b>${A_out} эВ</b>. Найдите макс. кинетическую энергию электрона (в эВ).`;
            } else {
                const N0 = 64, n_per = 3;
                correctAnswer = N0 / Math.pow(2, n_per);
                document.getElementById('task-text').innerHTML = `Было <b>${N0} млн</b> ядер. Прошло <b>${n_per} периода полураспада</b>. Сколько ядер осталось (в млн)?`;
            }
        }
    }

    function checkAnswer() {
        const userVal = parseFloat(document.getElementById('user-answer').value);
        const feedbackContainer = document.getElementById('feedback-container');

        if (isNaN(userVal)) {
            feedbackContainer.innerHTML = `<div class="feedback error">Введите числовой ответ!</div>`;
            return;
        }

        if (Math.abs(userVal - correctAnswer) < 0.05) {
            feedbackContainer.innerHTML = `<div class="feedback success">🎉 Верно! Отлично идешь к сотке.</div>`;
        } else {
            feedbackContainer.innerHTML = `<div class="feedback error">❌ Ошибка! Правильно: <b>${correctAnswer}</b>.</div>`;
        }

        document.getElementById('user-answer').style.display = 'none';
        document.querySelector('#answer-area .btn-success').style.display = 'none';
        document.getElementById('next-task-btn').style.display = 'block';
    }
</script>

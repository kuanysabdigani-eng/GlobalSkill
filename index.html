<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSkill - Платформа подготовки к ЕНТ</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 24px; margin: 0 0 4px 0; color: var(--primary); }
        .subtitle { font-size: 13px; color: var(--text-secondary); }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn {
            display: block; width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; text-align: center; margin-bottom: 12px;
            transition: background 0.2s; box-sizing: border-box;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); }
        .btn-success { background-color: var(--accent); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); color: #000; }

        .section-block {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px; margin-bottom: 12px;
            font-size: 13px; line-height: 1.6;
        }
        .section-block h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--primary); text-transform: uppercase; }
        .cheat-sheet {
            background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--accent);
            border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.6;
        }
        .cheat-sheet h3 { margin: 0 0 6px 0; font-size: 14px; color: var(--accent); }
        .solved-box {
            background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--warning);
            padding: 12px; border-radius: 0 12px 12px 0; font-size: 13px; margin-bottom: 12px; line-height: 1.5;
        }
        .solved-box h3 { margin: 0 0 4px 0; font-size: 13px; color: var(--warning); }
        input[type="number"] {
            width: 100%; padding: 14px; background-color: var(--bg);
            border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-size: 16px; margin-bottom: 12px; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary); }
        .task-condition { font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
        .feedback { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
        .feedback.error { background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .feedback.success { background-color: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: #6ee7b7; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
        .badge-main { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-sim { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .hidden { display: none !important; }
    </style>
</head>

        <button class="btn btn-secondary" onclick="openTopic('optics')">10. Оптика</button>
        <button class="btn btn-secondary" onclick="openTopic('quantum')">11. Квантовая и ядерная физика</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')" style="border-color: var(--primary); margin-top: 16px;">← На главную</button>

    <!-- Теория по теме -->
    <div id="screen-theory" class="card hidden">
        <h2 id="th-title" style="margin-top:0; font-size:18px; margin-bottom: 16px;"></h2>
        <div id="th-cheat" class="cheat-sheet hidden">
            <h3>💡 ЕНТ Лайфхаки</h3>
            <div id="th-cheat-text"></div>
        </div>
        <div class="section-block">
            <h3>Основные формулы</h3>
            <div id="th-formulas"></div>
        </div>
        <div class="solved-box">
            <h3>🔍 Пример решения</h3>
            <div id="th-solved"></div>
        </div>
        <button class="btn btn-success" onclick="startTrainer()" style="margin-top: 20px;">🎯 Запустить тренажер по теме (5 задач)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')" style="margin-top: 12px;">← К списку разделов</button>
    </div>

    <!-- Тренажер задач -->
    <div id="screen-trainer" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <span id="tr-badge" class="badge"></span>
            <span id="tr-counter" style="font-size: 13px; color: var(--text-secondary); font-weight: bold;">Задача 1 из 75</span>
        </div>

        <div id="exam-example-container" class="solved-box hidden">
            <h3 id="ex-title">🔍 Разбор похожего примера</h3>
            <div id="ex-text"></div>
        </div>

        <div class="task-condition" id="tr-text"></div>
        <div id="feedback-container"></div>

        <div id="answer-area">
            <input type="number" id="user-answer" placeholder="Введи числовой ответ" step="any">
            <button class="btn btn-success" onclick="checkAnswer()">Проверить</button>
        </div>

        <button id="back-to-topic-btn" class="btn btn-secondary" onclick="openTopic(currentKey)">← Назад к теории</button>
    </div>

    <!-- Экран завершения -->

        <button class="btn btn-secondary" onclick="showScreen('screen-physics-topics')">К списку разделов</button>
    </div>
</div>

function showScreen(id) {
    document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function openTopic(key) {
    if(!dataBase[key]) { alert("Ошибка загрузки темы!"); return; }
    currentKey = key;
    isSimulation = false;
    const item = dataBase[key];
    document.getElementById('th-title').innerText = item.title;
    document.getElementById('th-formulas').innerHTML = item.formulas;
    document.getElementById('th-solved').innerHTML = item.solved;

    const cheatEl = document.getElementById('th-cheat');
    document.getElementById('th-cheat-text').innerHTML = item.cheat || "• ЕНТ Лайфхак: Всегда проверяй перевод единиц в СИ!";
    cheatEl.classList.remove('hidden');
    
    document.getElementById('back-to-topic-btn').style.display = 'block';
    showScreen('screen-theory');
}

function startTrainer() {
    taskIndex = 0;
    isSimulation = false;
    activeTasksList = dataBase[currentKey].tasks;

    const badge = document.getElementById('tr-badge');
    badge.innerText = `🎯 Тренажер по теме (${activeTasksList.length} задач)`;
    badge.className = 'badge badge-main';

    document.getElementById('back-to-topic-btn').style.display = 'block';
    showScreen('screen-trainer');
    loadTask();
}

function startFullSimulation() {
    isSimulation = true;
    taskIndex = 0;
    activeTasksList = [...simulationHardPool];
    activeTasksList.sort(() => Math.random() - 0.5);

    const badge = document.getElementById('tr-badge');
    badge.innerText = `🔥 Мега-экзамен ЕНТ (75 задач)`;
    badge.className = 'badge badge-sim';

    document.getElementById('back-to-topic-btn').style.display = 'none';
    showScreen('screen-trainer');
    loadTask();
}

function loadTask() {
    document.getElementById('feedback-container').innerHTML = '';
    const inputField = document.getElementById('user-answer');
    inputField.value = '';
    inputField.style.display = 'block';
    document.querySelector('#answer-area .btn-success').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';

    document.getElementById('tr-counter').innerText = `Задача ${taskIndex + 1} из ${activeTasksList.length}`;
    
    const currentTask = activeTasksList[taskIndex];
    
    if(isSimulation) {
        document.getElementById('tr-badge').innerText = `⚡ Тема: ${currentTask.topic} (${taskIndex + 1}/75)`;
    }

    document.getElementById('tr-text').innerHTML = currentTask.text;

    const exampleContainer = document.getElementById('exam-example-container');
    if (isSimulation && currentTask.example) {
        document.getElementById('ex-text').innerHTML = currentTask.example;
        exampleContainer.classList.remove('hidden');
    } else {
        exampleContainer.classList.add('hidden');
    }
}

function checkAnswer() {
    const val = parseFloat(document.getElementById('user-answer').value);
    const correct = activeTasksList[taskIndex].ans;
    const fb = document.getElementById('feedback-container');

    if (isNaN(val)) {
        fb.innerHTML = `<div class="feedback error">Введите числовое значение!</div>`;
        return;
    }

    if (Math.abs(val - correct) <= Math.abs(correct * 0.03) + 0.1) {
        fb.innerHTML = `<div class="feedback success">🔥 Верно! Отличная работа.</div>`;
    } else {
        fb.innerHTML = `<div class="feedback error">❌ Ошибка. Правильный ответ: <b>${correct}</b></div>`;
    }

    document.getElementById('user-answer').style.display = 'none';
    document.querySelector('#answer-area .btn-success').style.display = 'none';

    const nextBtn = document.getElementById('next-btn');
    if (taskIndex < activeTasksList.length - 1) {
        nextBtn.innerText = 'Следующая задача →';
    } else {
        nextBtn.innerText = isSimulation ? 'Завершить мега-экзамен 🏆' : 'Завершить тему 🏆';
    }
    nextBtn.style.display = 'block';
}

function nextTask() {
    taskIndex++;
    if (taskIndex < activeTasksList.length) {
        loadTask();
    } else {
        if (isSimulation) {
            alert('🎉 Поздравляем! Ты прошел огромный мега-экзамен ЕНТ на 75 задач! С такой подготовкой ЕНТ будет по плечу!');
            showScreen('screen-physics-topics');
        } else {
            showScreen('screen-complete');
        }
    }
}
